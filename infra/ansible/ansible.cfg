# run from infra/ansible (the make targets do), with -i inventories/<env>/
[defaults]
roles_path = roles
# ssh host keys of new servers are taken on first contact and pinned after
# (accept-new below); a changed key on a known host still fails
host_key_checking = True
interpreter_python = /usr/bin/python3
forks = 10
callback_result_format = yaml
# the secrets role installs sops and age here on the controller
any_errors_fatal = False
nocows = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

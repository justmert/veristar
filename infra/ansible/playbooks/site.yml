---
# converges everything (plan phases 15 to 17): os baseline and secrets on
# every node, the edge and core infrastructure, the backup repository, the
# bootstrap, the services, then the monitoring of edge and core.
# a second run reports no changes.
- name: Baseline and secrets
  hosts: edge:core:backup
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - base
    - secrets

- name: Edge infrastructure (nats, etcd)
  hosts: edge
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - role: edge
      vars:
        edge_stage: infra

- name: Core infrastructure (postgres-ha, haproxy)
  hosts: core
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - role: core
      vars:
        core_stage: infra

# the local converge's pgbackrest repository node (roles/backup). in staging
# and production the backup group is empty and the repository is object
# storage, configured on the core nodes.
- name: Backup repository
  hosts: backup
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - backup

- name: Bootstrap
  ansible.builtin.import_playbook: bootstrap.yml

- name: Edge services
  hosts: edge
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - edge

- name: Core services
  hosts: core
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - core

# the design: node_exporter and the metrics relay on every edge and core
# node; prometheus, alertmanager, grafana and the exporters on the core
# nodes. after the services, because the relay joins the edge and core
# compose networks and the postgres_exporter role is created through the
# core node's haproxy. the probe node an operator input is not converged here: it
# has no private address, so the base role refuses it, and nothing installs
# docker on it yet.
- name: Observability
  hosts: edge:core
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - observability

---
# converges everything (plan phases 15 to 17): os baseline and secrets on
# every node, the edge and core infrastructure, the backup repository, the
# bootstrap, the services, then the monitoring of edge and core.
# a second run reports no changes.
#
# images: playbooks/verify-release.yml checks every platform image of the
# release first (needs -e sa_release_manifest=<release-images.json>), so the
# first converge and a node replacement pull verified digests like a rolling
# deploy does.
- name: Verify the release
  ansible.builtin.import_playbook: verify-release.yml

- name: Baseline and secrets
  hosts: edge:core:backup
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - base
    - secrets

# the pgbackrest repository before any database node archives to it
# (roles/storage): in azure it reads back what infra/tofu/modules/backup-storage
# set (versioning, immutability, the container); the local converge's s3
# stand-in gets its bucket created. backup_repo_mode defaults to azure in
# roles/backup, repeated here because role defaults are not visible to a
# play's conditions.
- name: Backup bucket
  hosts: core
  gather_facts: false
  vars_files: [../vars/pins.yml]
  tasks:
    - name: Converge the backup bucket
      ansible.builtin.include_role:
        name: storage
      when: (backup_repo_mode | default('azure')) in ['azure', 's3']

- name: Edge infrastructure (nats, etcd)
  hosts: edge
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - role: edge
      vars:
        edge_stage: infra

- name: Core infrastructure (postgres-ha, haproxy)
  hosts: core
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - role: core
      vars:
        core_stage: infra

# the local converge's pgbackrest repository node (roles/backup). in staging
# and production the backup group is empty and the repository is object
# storage, configured on the core nodes.
- name: Backup repository
  hosts: backup
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - backup

# the stanza, then the real archive_command on every database node, then
# pgbackrest check (roles/core tasks/archive.yml). until this
# play postgresql keeps its wal and archives nothing.
- name: WAL archiving
  hosts: core
  become: true
  vars_files: [../vars/pins.yml]
  tasks:
    - name: Enable wal archiving
      ansible.builtin.include_role:
        name: core
        tasks_from: archive.yml

- name: Bootstrap
  ansible.builtin.import_playbook: bootstrap.yml

- name: Edge services
  hosts: edge
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - edge

- name: Core services
  hosts: core
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - core

# the design: node_exporter and the metrics relay on every edge and core
# node; prometheus, alertmanager, grafana and the exporters on the core
# nodes. after the services, because the relay joins the edge and core
# compose networks and the postgres_exporter role is created through the
# core node's haproxy.
- name: Observability
  hosts: edge:core
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - observability

# a probe node in the probe group (a host outside azure with a public
# interface only, added to the inventory by hand): the os baseline without a
# private network, then caddy for the status page, gatus and the prober. the
# staging and production inventories from opentofu hold no probe host; the
# separate probe host runs the prober as a container instead
# (docs/deploy/probe.md), and this play matches no host. it needs the
# probe tenant's values in the sops file (docs/deploy/bootstrap.md step 10),
# so it comes after the platform is up.
- name: Probe
  hosts: probe
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - base
    - secrets
    - observability

---
# converges everything (plan phases 15 and 16): os baseline and secrets on
# every node, the edge and core infrastructure, the backup repository, the
# bootstrap, then the services.
# a second run reports no changes.
- name: Baseline and secrets
  hosts: edge:core:backup
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - base
    - secrets

- name: Edge infrastructure (nats, etcd)
  hosts: edge
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - role: edge
      vars:
        edge_stage: infra

- name: Core infrastructure (postgres-ha, haproxy)
  hosts: core
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - role: core
      vars:
        core_stage: infra

# the local converge's pgbackrest repository node (roles/backup). in staging
# and production the backup group is empty and the repository is object
# storage, configured on the core nodes.
- name: Backup repository
  hosts: backup
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - backup

- name: Bootstrap
  ansible.builtin.import_playbook: bootstrap.yml

- name: Edge services
  hosts: edge
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - edge

- name: Core services
  hosts: core
  become: true
  vars_files: [../vars/pins.yml]
  roles:
    - core

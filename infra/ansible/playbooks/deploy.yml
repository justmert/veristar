---
# rolling deploy of a new image tag: the bootstrap (migrations, nats
# topology), then core nodes one at a time, then edge nodes one at a time.
# the core tier goes first because the jobs and the control plane of a
# release read everything its gateways send, while an older jobs daemon
# refuses outcomes it does not know: from 0.3.0 on, the gateways send
# evidence counters on EDGE_STATS (docs/deploy/upgrade.md). each node is
# drained first: its port 80 answers 503, so the dns
# monitor removes it while https keeps serving the clients that still have its
# address; after the drain wait the node pulls, recreates what changed and must
# be healthy before the drain flag is removed and port 80 answers 308 again. a
# core node that holds the patroni leader hands it to the synchronous replica
# before its postgres is recreated; the leader's node goes last, so that
# happens once per run. any failure stops the run with the remaining
# nodes untouched.
#
#   ansible-playbook -i inventories/<env>/ playbooks/deploy.yml -e sa_image_tag=<release>
#
# images: nothing is pulled until every platform image of the release passed
# playbooks/tasks/verify-images.yml on the controller. the nodes then pull by
# the verified digest, never by tag alone.
#
#   ... playbooks/deploy.yml -e sa_image_tag=<release> -e sa_release_manifest=<release-images.json>
#
# deploy_drain_seconds: how long a drained node keeps serving before it is
# touched. traffic manager (infra/tofu/modules/failover) drops an endpoint
# after three failed probes: for in. and otlp. every 10 s with a 5 s timeout
# and a 10 s answer ttl, so a resolver may keep the address for up to
# 30 + 5 + 10 s; for app. every 30 s with a 10 s timeout and a 30 s
# ttl, up to 90 + 10 + 30 s. 120 s (edge) and 150 s (core) cover that with
# margin.
- name: Verify the release
  ansible.builtin.import_playbook: verify-release.yml

# every nats server gets the permissions of the new release before any of
# its services starts. they only add to the earlier release's, so the
# services still running keep theirs. the core tier goes first, and from
# 0.4.0 on its replayer consumes one consumer per web event partition, which
# the permissions of 0.3.x do not name; the edge tier, which renders the
# same block again, comes only after it.
- name: Install the nats permissions of the new release
  hosts: edge
  become: true
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  vars_files: [../vars/pins.yml]
  roles:
    - secrets
  tasks:
    - name: Render and install the nats authorization
      ansible.builtin.import_role:
        name: edge
        tasks_from: nats_auth.yml
    - name: Reload nats with it before the next server
      ansible.builtin.meta: flush_handlers

# the jobs daemons of the running release stop on every core node before
# the migrations: a migration can change what a task must write (00040 made
# traffic_class part of every api metric key), and a jobs daemon of the
# earlier release would keep writing the old way on the nodes not updated
# yet. each node's core role starts jobs again with the new image. while
# none runs, edge counters and api marks wait in nats and in
# api.rollup_pending, as during any jobs restart. a run that fails before a
# node is updated leaves jobs stopped there: run the deploy again, or
# `docker compose start jobs` in the core directory to go back.
- name: Stop the jobs daemons of the running release
  hosts: core
  become: true
  gather_facts: false
  tasks:
    - name: Find the core compose project
      ansible.builtin.stat:
        path: /opt/veristar/core/compose.yml
      register: deploy_core_compose

    - name: Stop jobs
      ansible.builtin.command:
        argv: [docker, compose, --project-directory, /opt/veristar/core, stop, jobs]
      when: deploy_core_compose.stat.exists
      changed_when: true

- name: Apply the migrations and the nats topology of the new release
  ansible.builtin.import_playbook: bootstrap.yml

# the patroni leader goes last, so it hands over once, to a member that is
# already done (tasks/leader_last.yml)
- name: Order the core nodes with the patroni leader last
  hosts: core
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files: [../vars/pins.yml]
  vars:
    leader_last_group: deploy_core_order
  tasks:
    - name: Order the core nodes
      ansible.builtin.include_tasks: tasks/leader_last.yml

- name: Deploy core nodes one by one
  hosts: deploy_core_order
  become: true
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  vars_files: [../vars/pins.yml]
  vars:
    sa_draining: true
    deploy_drain_seconds: 150
  pre_tasks:
    - name: Drain the node
      ansible.builtin.include_tasks: tasks/drain.yml
      vars:
        drain_dir: /etc/veristar/drain
    - name: Hand the patroni leader to the replica
      ansible.builtin.include_tasks: tasks/switchover.yml
  roles:
    - secrets
    - core
  post_tasks:
    - name: Undrain the node
      ansible.builtin.include_tasks: tasks/undrain.yml
      vars:
        drain_dir: /etc/veristar/drain

- name: Deploy edge nodes one by one
  hosts: edge
  become: true
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  vars_files: [../vars/pins.yml]
  vars:
    sa_draining: true
    deploy_drain_seconds: 120
  pre_tasks:
    - name: Drain the node
      ansible.builtin.include_tasks: tasks/drain.yml
      vars:
        drain_dir: /etc/veristar/drain
  roles:
    - secrets
    - edge
  post_tasks:
    - name: Undrain the node
      ansible.builtin.include_tasks: tasks/undrain.yml
      vars:
        drain_dir: /etc/veristar/drain

# the observability role's own images (prober and caddy on the probe node,
# docs/deploy/probe.md) and its configs move with the release too.
# verify-release.yml pinned platform_images, and with it
# observability_images.prober and .caddy, to the verified digests, so these
# never pull by tag alone. one node at a time: the relay and the exporters
# restart only where their config changed, so ingestion is not touched. the
# probe's os baseline and docker come from site.yml's probe play.
- name: Deploy the observability of every node
  hosts: edge:core:probe
  become: true
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  vars_files: [../vars/pins.yml]
  roles:
    # the probe has had no secrets loaded in this run yet
    - secrets
    - observability

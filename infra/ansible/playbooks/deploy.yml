---
# rolling deploy of a new image tag (plan phases 15 and 16): edge nodes one
# at a time, then core nodes one at a time. each node is drained first: its
# port 80 answers 503, so the dns monitor removes it while https keeps
# serving the clients that still have its address; after the drain wait the
# node pulls, recreates what changed and must be healthy before the drain
# flag is removed and port 80 answers 308 again. a core node that holds the
# patroni leader hands it to the synchronous replica before its postgres is
# recreated. any failure stops the run with the remaining nodes untouched.
#
#   ansible-playbook -i inventories/<env>/ playbooks/deploy.yml -e sa_image_tag=<release>
#
# images (this stage): nothing is pulled until every platform image of the
# release passed playbooks/tasks/verify-images.yml on the controller. the
# nodes then pull by the verified digest, never by tag alone.
#
#   ... playbooks/deploy.yml -e sa_image_tag=<release> -e sa_release_manifest=<release-images.json>
#
# deploy_drain_seconds: how long a drained node keeps serving before it is
# touched. bunny.net checks every 30 s and the record ttl is 60 s
# (infra/tofu envs), so a resolver that fetched the set just before removal
# may keep the address for up to 30 + 60 s; 120 s covers that with margin.
- name: Verify the release
  ansible.builtin.import_playbook: verify-release.yml

- name: Deploy edge nodes one by one
  hosts: edge
  become: true
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  vars_files: [../vars/pins.yml]
  vars:
    sa_draining: true
    deploy_drain_seconds: 120
  pre_tasks:
    - name: Drain the node
      ansible.builtin.include_tasks: tasks/drain.yml
      vars:
        drain_dir: /etc/stellar-analytics/drain
  roles:
    - secrets
    - edge
  post_tasks:
    - name: Undrain the node
      ansible.builtin.include_tasks: tasks/undrain.yml
      vars:
        drain_dir: /etc/stellar-analytics/drain

- name: Apply the nats topology of the new release
  ansible.builtin.import_playbook: bootstrap.yml

- name: Deploy core nodes one by one
  hosts: core
  become: true
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  vars_files: [../vars/pins.yml]
  vars:
    sa_draining: true
    deploy_drain_seconds: 120
  pre_tasks:
    - name: Drain the node
      ansible.builtin.include_tasks: tasks/drain.yml
      vars:
        drain_dir: /etc/stellar-analytics/drain
    - name: Hand the patroni leader to the replica
      ansible.builtin.include_tasks: tasks/switchover.yml
  roles:
    - secrets
    - core
  post_tasks:
    - name: Undrain the node
      ansible.builtin.include_tasks: tasks/undrain.yml
      vars:
        drain_dir: /etc/stellar-analytics/drain

# the observability role's own images (prober and caddy on the probe node,
# an operator input and its configs move with the release too. verify-release.yml
# pinned platform_images, and with it observability_images.prober and
# .caddy, to the verified digests. one node at a time: the
# relay and the exporters restart only where their config changed, so
# ingestion is not touched. the probe's os baseline and docker come from
# site.yml's probe play.
- name: Deploy the observability of every node
  hosts: edge:core:probe
  become: true
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  vars_files: [../vars/pins.yml]
  roles:
    # the probe has had no secrets loaded in this run yet
    - secrets
    - observability

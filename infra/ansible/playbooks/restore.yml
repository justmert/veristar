---
# restore onto a fresh node (plan phases 16 and 21), in one of two modes:
#
#   point in time:
#     ansible-playbook -i inventories/<env>/ playbooks/restore.yml \
#       -e restore_target='2026-11-13 10:00:00.123456+00'
#   one backup set, to the end of that backup (the migration export of
#   docs/handover/rebuild.md section 5):
#     ansible-playbook -i inventories/<env>/ playbooks/restore.yml \
#       -e restore_set=20261113-101500F
#
# the host of the restore group gets the os baseline, the pgbackrest
# settings, then pgbackrest restores the stanza and postgresql replays wal up
# to the target and promotes. the result is a standalone postgresql (not a
# patroni member, wal archiving off), so it can be checked and copied from
# without touching the running cluster or its repository.
#
# restore_source reads another environment's repository instead of this
# one's (a migration into this environment from the old one). it names that
# environment, its object storage and its sops file, from which only the
# object storage keys and the repository cipher passphrase are read:
#   -e '{"restore_source": {"environment": "production",
#        "object_storage": {"endpoint": "https://...", "region": "...", "backup_bucket": "..."},
#        "secrets_file": "/path/to/old/secrets.enc.yaml"}}'
# it needs object storage (backup_repo_mode s3, an operator input.
# the node must be fresh: an existing restore volume stops the run.
#
# restore_extra_args adds pgbackrest options, for example
#   -e '{"restore_extra_args": ["--repo=1", "--repo-target-time=2026-11-20 08:00:00+00"]}'
# to read the object-locked repository as it was before someone deleted
# from it (docs/deploy/backups.md section 3).
# pulls only verified image digests outside the local converge
- name: Verify the release
  ansible.builtin.import_playbook: verify-release.yml

- name: Restore to a point in time
  hosts: restore
  become: true
  vars_files: [../vars/pins.yml]
  vars:
    restore_volume: sa-restore-pgdata
    restore_container: sa-restore-postgres
    restore_pg_path: /var/lib/postgresql/patroni/data
  pre_tasks:
    - name: Require exactly one of a target time and a backup set
      ansible.builtin.assert:
        that:
          - (restore_target is defined) != (restore_set is defined)
          - restore_target is not defined or restore_target is match('^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:.]+[+-][0-9]{2}(:?[0-9]{2})?$')
          - restore_set is not defined or restore_set is match('^[0-9]{8}-[0-9]{6}F(_[0-9]{8}-[0-9]{6}[DI])?$')
          - restore_extra_args is not defined or (restore_extra_args | select('match', '^--[a-z0-9-]+(=.*)?$') | list | length) == (restore_extra_args | length)
        fail_msg: >-
          set restore_target to a timestamp with offset ('2026-11-13 10:00:00+00')
          or restore_set to a pgbackrest backup label (20261113-101500F), not both

    - name: Require the source repository settings
      ansible.builtin.assert:
        that:
          - restore_source.environment is match('^[a-z]+$')
          - restore_source.object_storage.endpoint is defined
          - restore_source.object_storage.region is defined
          - restore_source.object_storage.backup_bucket is defined
          - restore_source.secrets_file is file
          - backup_repo_mode == 's3'
        fail_msg: restore_source needs environment, object_storage (endpoint, region, backup_bucket), a readable secrets_file and object storage mode
      when: restore_source is defined
  roles:
    - base
    - secrets
  tasks:
    - name: Write the pgbackrest settings
      ansible.builtin.include_role:
        name: backup
        tasks_from: pg.yml
      when: restore_source is not defined

    # decrypted on the controller with the operator's age identity, which
    # must be a recipient of the old environment's file during the handover
    - name: Read the source environment's repository secrets
      community.sops.load_vars:
        file: "{{ restore_source.secrets_file }}"
        name: restore_source_secrets
        sops_binary: "{{ secrets_tools_dir }}/sops-{{ sops_version }}"
        age_keyfile: "{{ secrets_age_keyfile }}"
      when: restore_source is defined
      no_log: true

    # the same template, pointed at the source's bucket, path and cipher
    - name: Write the pgbackrest settings of the source repository
      ansible.builtin.include_role:
        name: backup
        tasks_from: pg.yml
      vars:
        backup_repo_environment: "{{ restore_source.environment }}"
        backup_repo_object_storage: "{{ restore_source.object_storage }}"
        backup_repo_access_key: "{{ restore_source_secrets.object_storage_access_key }}"
        backup_repo_secret_key: "{{ restore_source_secrets.object_storage_secret_key }}"
        backup_repo_cipher_pass: "{{ restore_source_secrets.pgbackrest_cipher_pass }}"
      when: restore_source is defined

    - name: Refuse a node that already holds a restore
      ansible.builtin.command:
        argv: [docker, volume, inspect, "{{ restore_volume }}"]
      register: restore_existing
      changed_when: false
      failed_when: restore_existing.rc == 0

    - name: Pull the postgres-ha image
      community.docker.docker_image_pull:
        name: "{{ platform_images.postgres_ha }}"
      register: restore_pull
      until: restore_pull is succeeded
      retries: 5
      delay: 10

    # the volume starts as a copy of the image's /var/lib/postgresql, which
    # holds the empty patroni directory owned by postgres
    # a backup set restores to its own end (type immediate): the state the
    # source had when the backup finished, which is the frozen source of a
    # migration
    - name: Restore the stanza
      ansible.builtin.command:
        argv: >-
          {{ ['docker', 'run', '--rm', '--network=host',
              '-v', restore_volume ~ ':/var/lib/postgresql',
              '-v', backup_conf_dir ~ ':/etc/pgbackrest:ro',
              '--entrypoint', 'pgbackrest', platform_images.postgres_ha,
              '--stanza=' ~ backup_stanza, '--pg1-path=' ~ restore_pg_path]
             + (['--type=time', '--target=' ~ restore_target] if restore_target is defined
                else ['--set=' ~ restore_set, '--type=immediate'])
             + (restore_extra_args | default([]))
             + ['--target-action=promote', 'restore'] }}
      register: restore_run
      changed_when: true

    # patroni's postgresql.conf came back with the data directory; the
    # overrides make this a standalone server: no wal archiving into the
    # production repository, no wait for a synchronous standby
    - name: Start postgresql on the restored data
      community.docker.docker_container:
        name: "{{ restore_container }}"
        image: "{{ platform_images.postgres_ha }}"
        network_mode: host
        entrypoint: [postgres]
        command:
          - -D
          - "{{ restore_pg_path }}"
          - -c
          - archive_mode=off
          - -c
          - synchronous_standby_names=
          - -c
          - "listen_addresses={{ sa_private_ip }},127.0.0.1"
          - -c
          - "restore_command=pgbackrest --stanza={{ backup_stanza }} archive-get %f \"%p\""
        volumes:
          - "{{ restore_volume }}:/var/lib/postgresql"
          - "{{ backup_conf_dir }}:/etc/pgbackrest:ro"
        restart_policy: "no"
        state: started

    - name: Wait for recovery to reach the target and promote
      ansible.builtin.command:
        argv: [docker, exec, "{{ restore_container }}", psql, -h, /var/run/postgresql, -U, postgres, -tAX, -c, "select pg_is_in_recovery()"]
      register: restore_promoted
      until: restore_promoted.rc == 0 and restore_promoted.stdout == 'f'
      retries: 300
      delay: 2
      changed_when: false

    - name: Report the restored server
      ansible.builtin.debug:
        msg: "restored to {{ restore_target | default('the end of backup ' ~ restore_set) }} on {{ sa_private_ip }}:5432"

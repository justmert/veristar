---
# posix-host mode: pgbackrest's tls protocol between the database nodes, the
# restore node and the repository node, with the node certificates of the
# internal ca (playbooks/internal-ca.yml, installed by the secrets role).
# the common name is the node name, which tls-server-auth matches; the
# private address is in the certificate, which the client checks against
# repo1-host and pgN-host.
- name: Require the node certificate from the secrets role
  ansible.builtin.assert:
    that:
      - backup_repo_mode == 'posix-host'
      - secrets_tls_doc is defined
      - secrets_tls_doc.nodes[inventory_hostname] is defined
    fail_msg: the pgbackrest tls protocol needs the secrets role first and a certificate for this node (make internal-ca)

- name: Create the pgbackrest config directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "999"
    group: "999"
    mode: "0700"
  loop:
    - "{{ backup_conf_dir }}"
    - "{{ backup_conf_dir }}/tls"

# the postgres user of the postgres-ha image (uid 999) runs pgbackrest
- name: Install this node's certificate, key and the ca
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ backup_conf_dir }}/tls/{{ item.dest }}"
    owner: "999"
    group: "999"
    mode: "0600"
  loop:
    - { dest: ca.crt, content: "{{ secrets_tls_doc.ca_bundle }}" }
    - { dest: node.crt, content: "{{ secrets_tls_doc.nodes[inventory_hostname].cert | trim }}\n" }
    - { dest: node.key, content: "{{ secrets_tls_doc.nodes[inventory_hostname].key | trim }}\n" }
  loop_control:
    label: "{{ item.dest }}"
  no_log: true

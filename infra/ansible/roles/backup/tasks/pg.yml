---
# pgbackrest settings of a database node (core) or of the restore node: the
# archive-push that postgresql's archive_command runs, and the restore.
- name: Check the backup inputs
  ansible.builtin.assert:
    that:
      - backup_repo_mode in ['azure', 's3', 'posix-host']
      - backup_repo_mode == 'azure' or sa_environment == 'local'
      - >-
        backup_repo_mode != 'azure' or (backup_repo_object_storage is mapping
        and backup_repo_object_storage.endpoint is match('^https://[a-z0-9]{3,24}\\.blob\\.core\\.windows\\.net$')
        and (backup_repo_object_storage.backup_bucket | default('')) | length > 0)
      - >-
        backup_repo_mode != 's3' or (backup_repo_object_storage is mapping
        and backup_repo_object_storage.endpoint is defined and backup_repo_object_storage.backup_bucket is defined)
      - backup_repo_mode != 's3' or (backup_repo_access_key | length > 0)
      - backup_repo_mode != 's3' or (backup_repo_secret_key | length > 0)
      - backup_repo_mode != 'posix-host' or (groups['backup'] | length == 1)
    fail_msg: >-
      backups need the azure storage account of infra/tofu/modules/backup-storage
      (sa_object_storage in the inventory, endpoint
      https://<account>.blob.core.windows.net). the s3 and posix-host
      stand-ins are for the local converge only; s3 needs the stand-in's
      keys, posix-host exactly one backup node.

- name: Set up pgbackrest tls
  ansible.builtin.include_tasks: tls.yml
  when: backup_repo_mode == 'posix-host'

- name: Create the pgbackrest config directory
  ansible.builtin.file:
    path: "{{ backup_conf_dir }}"
    state: directory
    owner: "999"
    group: "999"
    mode: "0700"
  when: backup_repo_mode in ['azure', 's3']

# local converge only (LC_BACKUP=s3): the object storage stand-in's ca
- name: Install the object storage stand-in's ca
  ansible.builtin.copy:
    src: "{{ backup_repo_object_storage.ca_file }}"
    dest: "{{ backup_conf_dir }}/s3-ca.crt"
    owner: "999"
    group: "999"
    mode: "0644"
  when: backup_repo_mode == 's3' and backup_repo_object_storage.ca_file is defined

- name: Write the pgbackrest config of this database node
  ansible.builtin.template:
    src: pgbackrest-pg.conf.j2
    dest: "{{ backup_conf_dir }}/pgbackrest.conf"
    owner: "999"
    group: "999"
    mode: "0600"
  no_log: true

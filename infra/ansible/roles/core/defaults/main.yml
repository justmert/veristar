---
core_dir: /opt/veristar/core
core_conf_dir: /etc/veristar/core

# the compose network of a core node; postgresql's pg_hba admits it because
# haproxy and the services reach the database from it
core_compose_subnet: 172.29.10.0/24

# every core node runs a patroni member (the design): one leader, one
# synchronous replica, etcd on the edge nodes as the consensus store
core_postgres_hosts: "{{ groups['core'] }}"

# patroni settings kept in etcd. synchronous_mode makes a commit wait for the
# replica, and patroni promotes only that synchronous replica, so a failover
# loses no committed transaction. it is not strict: with the replica gone
# the leader goes on alone, so writes never stop because one node is down;
# during that time a second failure can lose what only the leader had.
# ttl 30 and loop_wait 10 are patroni's defaults: a dead leader's key
# expires within 30 s, and the replica takes over at its next loop.
core_patroni_dcs:
  ttl: 30
  loop_wait: 10
  retry_timeout: 10
  maximum_lag_on_failover: 1048576
  synchronous_mode: true
  synchronous_mode_strict: false
  # without failsafe a leader that loses etcd quorum (two edge nodes down,
  # the edge tier cut off from the core tier, an edge rebuild that did not
  # rejoin etcd) demotes itself although both database nodes are fine. with
  # it, the leader stays primary as long as it reaches every member listed
  # in /failsafe through the rest api, so an edge-side failure no longer
  # stops the dashboards and the pipeline.
  failsafe_mode: true

# wal archiving to the pgbackrest repository. archive_timeout bounds how old
# the newest archived wal may be, which is the data-loss window when both
# database nodes are lost at once (docs/reference/availability.md)
core_archive_timeout: 60

# the retain-web systemd timer (the design): `jobs retain-web` as the
# jobs_retention role once a day. two runs at once are safe (cmd/jobs), and
# each core node runs at its own minute so one node down still runs it.
core_retain_web_hour: 3

# postgresql settings for a Standard_B2as_v2 (2 vcpu, 8 GB), which it
# shares with umami, the platform services and the observability stack;
# patroni owns the rest. shared_buffers stays at a quarter of memory, and
# effective_cache_size counts what the page cache can hold beside the
# other processes (about 4 GB).
core_postgres_parameters:
  max_connections: 200
  shared_buffers: 2GB
  effective_cache_size: 4GB
  work_mem: 16MB
  maintenance_work_mem: 256MB
  wal_level: replica
  max_wal_senders: 10
  max_replication_slots: 10
  wal_log_hints: "on"
  hot_standby: "on"
  password_encryption: scram-sha-256
  log_line_prefix: "%m [%p] %q%u@%d "
  # the platform never logs client data; statement logging stays off
  log_statement: none

# api metric retention, the same horizons for jobs and the control plane
# (docs/reference/api-storage.md)
core_api_minute_retention_days: 30
core_api_hourly_retention_months: 36

# the alertmanager port of the observability role
# (observability_alertmanager_port), repeated here because role defaults are
# not visible across plays. the control plane reads the live alerts of every
# member there for the operator alerts page.
core_alertmanager_port: 9093

# each event costs the replayer several confirmed round trips to nats
# (duplicate guard, visit state, ack), whose leaders can sit in another
# location. with 16 lanes this stage measured about 80 events a second against
# a 500 per second load; lanes run in parallel per visitor, so 128 lanes
# (the in-flight bound stays under the consumer's max ack pending of 1000)
core_replayer_env:
  REPLAYER_WORKERS: "128"
  REPLAYER_MAX_IN_FLIGHT: "900"
core_metricswriter_env:
  METRICSWRITER_BATCH: "256"
  METRICSWRITER_FIRST_POINT_THRESHOLD: 120s
  METRICSWRITER_ROUTE_CAP: "300"
  METRICSWRITER_SERVICE_CAP: "50"

# umami processes per core node. one umami process is one node.js process
# and drained about 280 events a second in the this stage load drill, below the
# 500 a second of the 10x profile. the replayer spreads visitors over all of
# them by its lane hash. measured on one host with each process capped at
# one core (internal/replayer TestDrainRateByUmamiProcesses,
# docs/reference/drills/2026-11-13.md): 1 process about 440 to 500 events/s,
# 2 about 680 to 755, 3 about 840 to 930, 4 about 1,160, so 4 is 2.3 times
# one. scaled from the drill's 280/s that gives about 650/s for 4 and 520/s
# for 3, and 4 is the smallest count with a clear margin over 500/s. each
# idle process holds about 115 MB. must stay at most REPLAYER_WORKERS.
#
# on the azure core node (Standard_B2as_v2, 2 vcpu, 8 GB) the count is 2.
# memory would fit 4 (about 460 MB idle), but the drain rate comes from
# cpu: the measurement above gave each process its own core, and this node
# has two, shared with postgresql. a third and fourth process would only
# take turns on the same cores. by the same measurement 2 processes drain
# about 1.5 times one, about 420 events/s scaled from the drill's 280/s.
# that is far above the 1x profile (50/s) and below the 10x burst profile
# (500/s): a burst queues in jetstream and drains after it, which keeps
# ingestion up and delays the dashboards (docs/reference/availability.md).
# the rate on this node size has not been measured yet; this stage's load
# drill on staging measures it.
core_umami_processes: 2

# local converge only: sign in through the test-only github oauth fixture
# (docs/deploy/local-converge.md). refused in any other environment.
core_oauth_fixture: false
core_oauth_fixture_image: ""
core_oauth_fixture_port: 8099

core_stage: services

# haproxy's stats frontend: /metrics (prometheus exporter, scraped through
# the observability relay) and /stats (loopback, ssh tunnel only)
core_haproxy_stats_port: 8404

# where deploy.yml puts the drain flag; caddy answers 503 on port 80 while it
# exists, which takes the node out of dns (deploy/caddy/assemble.sh)
core_drain_dir: /etc/veristar/drain

# ipv6-only docker network that only caddy joins, so published ipv6 ports
# keep the visitor's address. a unique local prefix: it never
# leaves the node, and every node may use the same one.
core_public6_subnet: fd53:6100:c::/64

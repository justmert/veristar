---
# docker's restart policy does not retry a container whose start failed
# while the daemon came up. after an unclean power-off in the this stage edge
# loss drill the nats container stayed exited that way, so a oneshot unit
# starts every existing container of the project once docker is up. start
# never recreates anything, so it cannot apply a half-written change.
# compose start waits for each dependency's health condition before it
# starts a dependent (on core, umami's start period alone is 120 s), so the
# unit gets far more than systemd's 90 s default for a oneshot; killed at
# 90 s it would leave the dependents that docker did not start down.
- name: Install the start-at-boot unit of the compose project
  ansible.builtin.copy:
    content: |
      # managed by ansible (infra/ansible/roles/core)
      [Unit]
      Description=start the core compose project's containers after boot
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      TimeoutStartSec=15min
      ExecStart=/usr/bin/docker compose --project-directory {{ core_dir }} start

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/sa-core-start.service
    owner: root
    group: root
    mode: "0644"
  register: core_start_unit

- name: Enable the start-at-boot unit
  ansible.builtin.systemd_service:
    name: sa-core-start.service
    enabled: true
    daemon_reload: "{{ core_start_unit is changed }}"

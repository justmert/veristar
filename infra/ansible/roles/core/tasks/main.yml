---
- name: Check the core inputs
  ansible.builtin.assert:
    that:
      - sa_tier in ['core', 'node']
      - groups['edge'] | length == 3
      - sa_secrets is defined
      - sa_tls in ['cloudflare', 'cloudflare-delegated', 'internal']
      - sa_tls != 'internal' or sa_environment == 'local'
      # cloudflare-delegated: certificates through the old zone's cname during a
      # handover cutover (docs/handover/plan.md section 2.3)
      - sa_tls != 'cloudflare-delegated' or (sa_acme_challenge_domain | default('')) is match('^[a-z0-9_.-]+\\.[a-z]+$')
      - sa_operator_github_ids is defined and (sa_operator_github_ids | string | length) > 0
      - not core_oauth_fixture or sa_environment == 'local'
      - core_umami_processes | int >= 1
      # the metrics writer accepts points as old as API_METRICS keeps
      # messages (7 days), so their minute partitions must still exist; one
      # more day covers the utc day boundary (internal/config
      # MinMinuteRetentionDays, review). jobs refuses less at start,
      # this stops the converge before that
      - core_api_minute_retention_days | int >= 8
      - core_umami_processes | int <= core_replayer_env.REPLAYER_WORKERS | int
    fail_msg: >-
      core needs the secrets role first, OPERATOR_GITHUB_IDS an operator input as
      sa_operator_github_ids, acme dns-01 outside the local converge, the
      oauth fixture only in the local converge, between 1 and
      REPLAYER_WORKERS umami processes (core_umami_processes), and
      core_api_minute_retention_days of at least 8

- name: Name the core peers
  vars:
    core_nats_first: "{{ groups['core'].index(inventory_hostname) % (groups['edge'] | length) }}"
  ansible.builtin.set_fact:
    # a converged node's services use only the server on their own node, for
    # the reason in roles/edge (edge_nats_urls); a core-only node lists every
    # edge server, starting at a different one per core index (the clients
    # keep the order, natsx.Options)
    core_nats_urls: >-
      {{ ('tls://' ~ sa_private_ip ~ ':4222') if core_node else
         ((groups['edge'][core_nats_first | int:] + groups['edge'][:core_nats_first | int])
          | map('extract', hostvars, 'sa_private_ip') | map('regex_replace', '^(.*)$', 'tls://\1:4222') | join(',')) }}
    core_runs_postgres: "{{ inventory_hostname in core_postgres_hosts }}"

- name: Create the core directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.owner | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ core_dir }}", mode: "0755" }
    - { path: "{{ core_conf_dir }}", mode: "0755" }
    # patroni's own directory, mounted whole: a single-file bind mount keeps
    # the inode it started with, so a rewritten patroni.yml (an atomic
    # rename) was never seen by the sighup reload
    - { path: "{{ core_conf_dir }}/patroni", mode: "0700", owner: "999" }
    - { path: "{{ core_drain_dir }}", mode: "0755" }

- name: Assemble the core caddyfile on the controller
  ansible.builtin.command:
    # a converged node's caddy serves the edge sites too
    argv: >-
      {{ ['sh', core_caddy_dir ~ '/assemble.sh', 'node' if core_node else 'core']
         + ((['edge'] if core_node else []) + ['app', 'web']) | map('regex_replace', '^', core_caddy_dir ~ '/')
           | map('regex_replace', '$', '.Caddyfile') | list }}
  vars:
    core_caddy_dir: "{{ playbook_dir }}/../../../deploy/caddy"
  register: core_caddyfile
  changed_when: false
  delegate_to: localhost
  run_once: true
  become: false

- name: Install the caddyfile
  ansible.builtin.copy:
    content: "{{ core_caddyfile.stdout }}\n"
    dest: "{{ core_dir }}/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  register: core_caddyfile_file

# public, because patroni.yml and compose.yml use the backup role's settings
- name: Write the pgbackrest settings
  ansible.builtin.include_role:
    name: backup
    tasks_from: pg.yml
    public: true
  when: core_runs_postgres

# tasks/archive.yml leaves the marker once the stanza exists; until then
# patroni.yml carries an empty archive_command
- name: Find out whether the stanza exists
  ansible.builtin.stat:
    path: "{{ backup_conf_dir }}/stanza-ready"
  register: core_stanza_marker
  when: core_runs_postgres

- name: Choose the archive command
  ansible.builtin.set_fact:
    core_archive_command: >-
      {{ ('pgbackrest --stanza=' ~ backup_stanza ~ ' archive-push %p') if core_stanza_marker.stat.exists else '' }}
  when: core_runs_postgres

# the postgres-ha image runs patroni as the postgres user (uid 999 in the
# official image), which must read its config and nobody else
- name: Write the patroni config
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: "{{ core_conf_dir }}/patroni/patroni.yml"
    owner: "999"
    group: "999"
    mode: "0600"
  when: core_runs_postgres
  no_log: true
  notify: Reload patroni

- name: Write the haproxy config
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ core_conf_dir }}/haproxy.cfg"
    owner: root
    group: root
    mode: "0644"
  notify: Reload haproxy

# a oneshot unit that starts the project's containers once docker is up,
# also run alone by the restart drill (tests/drills/start-unit.sh)
- name: Install the start-at-boot unit
  ansible.builtin.include_tasks: start_unit.yml

- name: Write the compose project
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ core_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
    validate: docker compose -f %s config --quiet

# pulls are retried on their own: a registry answering one request with an
# error (seen once from quay.io during the local converge) must not fail the
# node, while every other compose failure still does
- name: Pull the core images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ core_dir }}"
    files: [compose.yml]
    policy: missing
  register: core_pull
  until: core_pull is succeeded
  retries: 5
  delay: 10

- name: Start the core services
  community.docker.docker_compose_v2:
    project_src: "{{ core_dir }}"
    files: [compose.yml]
    # umami needs its database, which bootstrap creates, so it is not infra
    services: >-
      {{ ((['postgres', 'haproxy'] + (['pgbackrest'] if backup_repo_mode == 'posix-host' else []))
          if core_runs_postgres else ['haproxy']) if core_stage == 'infra' else omit }}
    state: present
    pull: missing
    wait: true
    wait_timeout: 600
  register: core_compose

- name: Reload caddy after a caddyfile change
  ansible.builtin.command:
    argv: [docker, compose, --project-directory, "{{ core_dir }}", exec, caddy, caddy, reload, --config, /etc/caddy/Caddyfile]
  when: core_stage != 'infra' and core_caddyfile_file is changed and core_compose is not changed
  changed_when: true

- name: Apply config reloads now
  ansible.builtin.meta: flush_handlers

# bootstrap.dcs applies only when the cluster is created; afterwards the
# live settings are kept equal to core_patroni_dcs through the rest api
- name: Read the patroni cluster settings
  ansible.builtin.uri:
    url: "https://{{ sa_private_ip }}:8008/config"
    ca_path: "{{ sa_tls_root.ca_path }}"
    client_cert: "{{ sa_tls_root.client_cert }}"
    client_key: "{{ sa_tls_root.client_key }}"
    return_content: true
  register: core_dcs
  until: core_dcs.status == 200
  retries: 60
  delay: 2
  when: core_runs_postgres and inventory_hostname == core_postgres_hosts[0]

- name: Apply the patroni cluster settings
  ansible.builtin.uri:
    url: "https://{{ sa_private_ip }}:8008/config"
    ca_path: "{{ sa_tls_root.ca_path }}"
    client_cert: "{{ sa_tls_root.client_cert }}"
    client_key: "{{ sa_tls_root.client_key }}"
    method: PATCH
    body_format: json
    body: "{{ core_patroni_dcs }}"
    url_username: patroni
    url_password: "{{ sa_secrets.patroni_restapi_password }}"
    force_basic_auth: true
  when:
    - core_runs_postgres and inventory_hostname == core_postgres_hosts[0]
    - core_dcs.json | dict2items | selectattr('key', 'in', core_patroni_dcs.keys() | list) | items2dict != core_patroni_dcs
  changed_when: true
  no_log: true

- name: Install the retain-web timer
  ansible.builtin.include_tasks: retain_web.yml
  when: core_stage != 'infra'

- name: Install the backup schedules on the database nodes (object storage)
  ansible.builtin.include_role:
    name: backup
    tasks_from: timers.yml
  vars:
    backup_compose_dir: "{{ core_dir }}"
    backup_compose_service: postgres
  when: core_runs_postgres and backup_repo_mode in ['azure', 's3']

# deploy.yml drains the node first, which turns port 80 to 503 on purpose;
# a drained node is checked behind caddy, at the same composite endpoint
- name: Wait for this node's composite health behind caddy while it is drained
  ansible.builtin.command:
    argv: [docker, compose, --project-directory, "{{ core_dir }}", exec, -T, caddy, wget, -q, -O, /dev/null, "http://controlplane:9090/corez"]
  register: core_drained_health
  until: core_drained_health.rc == 0
  retries: 90
  delay: 2
  when: core_stage != 'infra' and sa_draining | default(false)
  changed_when: false

# a converged node answers the edge health at "/" and the core health at
# "/core" (deploy/caddy/assemble.sh, tier node); both must pass
- name: Wait for this node's composite health on port 80
  ansible.builtin.uri:
    url: "http://{{ sa_public_bind_ipv4 | default(sa_public_ipv4) }}{{ item }}"
    follow_redirects: none
    status_code: 308
  register: core_health
  until: core_health.status == 308
  retries: 90
  delay: 2
  loop: "{{ ['/', '/core'] if core_node else ['/'] }}"
  when: core_stage != 'infra' and not (sa_draining | default(false))
  changed_when: false

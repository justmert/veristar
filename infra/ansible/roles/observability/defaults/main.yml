---
# observability role (the design). runs on every node:
#   every node   node_exporter and a metrics relay (haproxy) that serves the
#                /metrics of the node's compose services on the private
#                address, so prometheus on the core nodes can scrape them
#                without the edge and core compose projects publishing their
#                ops ports
#   edge nodes   prometheus-nats-exporter beside the node's nats server,
#                reading its monitoring port inside the node
#   core nodes   prometheus, alertmanager (two-node cluster), grafana,
#                postgres_exporter on the postgres hosts. prometheus and grafana bind loopback
#                only: reach them with `ssh -L 9090:127.0.0.1:9090` and
#                `ssh -L 3000:127.0.0.1:3000`
#   probe node   caddy for status.<BASE_DOMAIN>, gatus and the prober
observability_dir: /opt/veristar/observability
observability_conf_dir: /etc/veristar/observability

# upstream images, tag and index digest as in the design (resolved
# 2026-11-12). each also has deploy/images/upstream/<name>.Dockerfile, which
# dependabot watches; tests/pins fails when the two differ
observability_images:
  prometheus: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
  alertmanager: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
  grafana: grafana/grafana:13.2.6@sha256:b21409d7951ddcfd63a4b49083e4ef2cc35bc1437d071813bf82bfb238b00bca
  # gatus 5.38.0 and the alpine haproxy build taken on 2026-11-13 for
  # fixable high findings (docs/security/supply-chain.md section 8.1)
  gatus: twinproduction/gatus:v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
  postgres_exporter: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
  nats_exporter: natsio/prometheus-nats-exporter:0.20.3@sha256:4b8ddc1c86fec360b5cd3d5e1fbc6fb52bdafd5805bba3901cc52926538af255
  node_exporter: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
  haproxy: haproxy:3.4.7-alpine@sha256:b9fe316f718d5015c5cfebd8ca019591f3e44656f61d93cb8b59a1028961e530
  # the platform's own images (deploy/images/go-service.Dockerfile with
  # CMD=prober, and the custom caddy build)
  # (vars/pins.yml platform_images, which playbooks/verify-release.yml pins
  # to the verified digests)
  prober: "{{ platform_images.prober }}"
  caddy: "{{ platform_images.caddy }}"

# the compose project of each tier, whose network the relay joins
observability_tier_network:
  edge: veristar-edge_default
  core: veristar-core_default

# relay ports on the private address, and the compose service and port
# behind each. the collector's own telemetry is on 8888 (collector/otelcol.yaml).
# caddy serves its metrics on 2021 of the node's compose network
# (deploy/caddy/assemble.sh), haproxy its prometheus exporter on the core
# role's stats port (core_haproxy_stats_port).
observability_relay:
  edge:
    - {job: gateway, port: 9301, target: "gateway:9090"}
    - {job: collector, port: 9302, target: "collector:8888"}
    - {job: caddy, port: 9307, target: "caddy:2021"}
    - {job: nats, port: 9309, target: "nats-exporter:7777"}
  core:
    - {job: controlplane, port: 9303, target: "controlplane:9090"}
    - {job: replayer, port: 9304, target: "replayer:9090"}
    - {job: metricswriter, port: 9305, target: "metricswriter:9090"}
    - {job: jobs, port: 9306, target: "jobs:9090"}
    - {job: caddy, port: 9307, target: "caddy:2021"}
    - {job: haproxy, port: 9308, target: "haproxy:{{ core_haproxy_stats_port | default(8404) }}"}
# every listener of this role on the private address is tls with the node
# certificate and asks the client for one of the internal ca (finding
# O-26); prometheus presents its node's certificate. only the this stage test
# stack (tests/observability), which renders these templates without
# running the role, sets this to false; the role refuses false.
observability_tls: true
# nats monitoring served to the private network by the relay, over the
# same tls, for operators and the drills (any GET path, not only /metrics);
# nats itself publishes it on the node's loopback only (roles/edge)
observability_nats_monitor_relay_port: 8222
observability_node_exporter_port: 9100
observability_postgres_exporter_port: 9187
observability_nats_monitor_port: 8222
observability_etcd_client_port: 2379
observability_patroni_port: 8008
observability_alertmanager_port: 9093
observability_alertmanager_cluster_port: 9094

observability_scrape_interval: 15s
observability_prometheus_retention: 30d

# the probe (the design): every interval one web event and one otlp
# metric. FreshnessMaxDelay is the 10 minutes of the plan.
observability_probe_interval: 30s
observability_probe_timeout: 10s
observability_probe_freshness_max_delay: 10m
observability_probe_cert_min_validity: 336h
# umami drops events whose user agent looks like a bot, so the probe sends a
# current browser user agent; it is the only thing about the probe that
# imitates a browser, and it is set here where it can be seen
observability_probe_user_agent: "Mozilla/5.0 (X11; Linux x86_64; rv:146.0) Gecko/20100101 Firefox/146.0"
observability_probe_domain: "probe.{{ sa_base_domain }}"

# gatus keeps this many results per endpoint: one week at 30 s, so the daily
# sloreport collection (docs/slo/data) can miss six days and still catch up.
# sloreport collect -page-size must be the same number.
observability_gatus_max_results: 20160

# postgresql runs under patroni on these core nodes (the core role's
# core_postgres_hosts, which is every core node unless the inventory says
# otherwise); postgres_exporter runs beside each. the core role's defaults are
# not visible in the observability play, so its default is repeated here.
observability_postgres_hosts: "{{ core_postgres_hosts | default(groups['core']) }}"
observability_patroni_hosts: "{{ observability_postgres_hosts }}"
observability_core_dir: /opt/veristar/core

# the checkout the controller runs from (playbooks live in infra/ansible/playbooks)
observability_repo_root: "{{ playbook_dir }}/../../.."

# container user of gatus, whose image defaults to root (the design
# hardening); its data volume is handed to this uid by the volume-owners step
observability_gatus_uid: 8080

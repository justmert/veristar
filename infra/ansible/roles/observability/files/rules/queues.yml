---
# alert rules, nats and the two queue consumers. the stream
# numbers come from prometheus-nats-exporter 0.20.3 (-jsz=all), one per nats
# server; every replica reports the stream, so they are reduced by stream.
groups:
  - name: queues
    rules:
      - record: sa:stream_messages:max
        expr: max by (stream_name) (jetstream_stream_total_messages)
      - record: sa:stream_first_seq:max
        expr: max by (stream_name) (jetstream_stream_first_seq)
      - record: sa:consumer_backlog:max
        expr: max by (stream_name, consumer_name) (jetstream_consumer_num_pending + jetstream_consumer_num_ack_pending)
      # the replayer consumes WEB_EVENTS through one consumer per partition
      # (replayer-p00 to replayer-p31) and, while an upgrade drains it, the
      # legacy consumer "replayer"; its backlog is their sum
      - record: sa:replayer_backlog:sum
        expr: sum by (stream_name) (sa:consumer_backlog:max{stream_name="WEB_EVENTS",consumer_name=~"replayer(-p[0-9]+)?"})

      # the exporter has no first-message timestamp. WEB_EVENTS and
      # API_METRICS are work queues, so the first sequence is the oldest
      # unacknowledged message: when the stream was never empty and its first
      # sequence did not move for 10 minutes, the oldest message is at least
      # 10 minutes old. that is the freshness budget of docs/sla.md.
      - alert: QueueOldestMessageTooOld
        expr: |
          (min_over_time(sa:stream_messages:max{stream_name=~"WEB_EVENTS|API_METRICS"}[10m]) > 0)
          and on (stream_name)
          (changes(sa:stream_first_seq:max{stream_name=~"WEB_EVENTS|API_METRICS"}[10m]) == 0)
        labels: {severity: page}
        annotations:
          summary: "the oldest message in {{ $labels.stream_name }} has waited at least 10 minutes"
          runbook: docs/runbooks/alerts.md#queueoldestmessagetooold

      - alert: ReplayerLagHigh
        expr: sa:replayer_backlog:sum > 5000
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $value }} web events wait for the replayer"
          runbook: docs/runbooks/alerts.md#replayerlaghigh
      # WEB_EVENTS keeps a message at most 72 hours (max age, discard old)
      # and then drops it without a trace, so a backlog that the replayer
      # drains more slowly than the gateways fill it ends in lost page views.
      # each instance reports the stream publish time of the oldest message
      # it holds over the partitions it owns. every partition is fetched in
      # stream order, so in a backlog the largest of these is the oldest
      # message of the stream. an instance that holds nothing reports 0,
      # hence max().
      - alert: WebEventsDelayed
        expr: max(replayer_oldest_pending_age_seconds) > 3600
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "the oldest web event the replayer holds was accepted {{ $value | humanizeDuration }} ago"
          runbook: docs/runbooks/alerts.md#webeventsdelayed-webeventsneardiscard-webeventsbackloggrowing
      - alert: WebEventsNearDiscard
        expr: max(replayer_oldest_pending_age_seconds) > 48 * 3600
        labels: {severity: page}
        annotations:
          summary: "web events {{ $value | humanizeDuration }} old wait for umami; WEB_EVENTS drops them at 72 hours"
          runbook: docs/runbooks/alerts.md#webeventsdelayed-webeventsneardiscard-webeventsbackloggrowing
      # the backlog is large and grew over the last hour: the gateways accept
      # faster than the replayer delivers, so it will not drain by itself
      - alert: WebEventsBacklogGrowing
        expr: |
          (sa:replayer_backlog:sum > 10000)
          and (delta(sa:replayer_backlog:sum[1h]) > 0)
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: "the web event backlog is {{ $value }} and grew over the last hour"
          runbook: docs/runbooks/alerts.md#webeventsdelayed-webeventsneardiscard-webeventsbackloggrowing
      - alert: MetricsWriterLagHigh
        expr: sa:consumer_backlog:max{stream_name="API_METRICS",consumer_name="metricswriter"} > 5000
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $value }} metric batches wait for the metrics writer"
          runbook: docs/runbooks/alerts.md#metricswriterlaghigh
      # no instance owns a partition: nothing consumes, whatever the backlog
      - alert: ReplayerNotConsuming
        expr: (sum(replayer_leader) < 1) or absent(replayer_leader)
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "no replayer instance owns a WEB_EVENTS partition and consumes"
          runbook: docs/runbooks/alerts.md#replayernotconsuming
      # some partitions have no owner: their visitors' events wait while the
      # others are delivered. a node that stops hands its partitions over
      # within seconds and a killed one within about a minute (lock ttl and
      # ack wait), so 5 minutes is a real gap
      - alert: ReplayerPartitionsUnowned
        expr: max(replayer_partitions) - sum(replayer_partitions_owned) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "{{ $value }} WEB_EVENTS partitions have no replayer owner"
          runbook: docs/runbooks/alerts.md#replayerpartitionsunowned
      # the replayer sends each visitor to one umami process of its node. a
      # process that stopped answering holds its visitors back in their lanes
      # while the others go on, so the node's total rate alone hides it. above one
      # event a second the visitors spread over every process; below it a
      # process can see none for ten minutes by chance.
      - alert: ReplayerUmamiProcessIdle
        expr: |
          (sum by (node, process) (rate(replayer_umami_sends_total[10m])) == 0)
          and on (node) (sum by (node) (rate(replayer_umami_sends_total[10m])) > 1)
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "umami process {{ $labels.process }} on {{ $labels.node }} stored no event for 15 minutes while the others did"
          runbook: docs/runbooks/alerts.md#replayerumamiprocessidle
      # visit_state holds a sent.<event id> key per delivered
      # event for 24 hours under a byte limit. a full bucket no longer stops
      # delivery, but every event then goes without its duplicate guard and
      # visit continuity, so it is announced before it fills and when it is
      # full. the replayer samples the bucket every 5 seconds.
      - alert: ReplayerVisitStateNearlyFull
        expr: max(replayer_visit_state_bytes / replayer_visit_state_max_bytes) > 0.8
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "visit_state is {{ $value | humanizePercentage }} full"
          runbook: docs/runbooks/alerts.md#replayervisitstatenearlyfull-replayervisitstatefull
      - alert: ReplayerVisitStateFull
        expr: sum(increase(replayer_visit_state_writes_skipped_total[5m])) > 0
        labels: {severity: page}
        annotations:
          summary: "visit_state is full: {{ $value }} duplicate guard and visit writes skipped in 5 minutes"
          runbook: docs/runbooks/alerts.md#replayervisitstatenearlyfull-replayervisitstatefull
      - alert: MetricsWriterNotConsuming
        expr: (sum(metricswriter_leader) < 1) or absent(metricswriter_leader)
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "no metrics writer instance holds the lock and consumes API_METRICS"
          runbook: docs/runbooks/alerts.md#metricswriternotconsuming

      - alert: DLQNotEmpty
        expr: sa:stream_messages:max{stream_name=~"WEB_DLQ|API_DLQ"} > 0
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.stream_name }} holds {{ $value }} messages"
          runbook: docs/runbooks/alerts.md#dlqnotempty

      # three servers; jetstream needs two for a meta leader. a server
      # counts when its exporter reads jetstream from it.
      - alert: NATSQuorumLost
        expr: |
          (count(jetstream_server_jetstream_disabled == 0) or vector(0)) < 2
          or absent(jetstream_server_total_streams{is_meta_leader="true"})
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "nats jetstream has no quorum or no meta leader"
          runbook: docs/runbooks/alerts.md#natsquorumlost
      - alert: NATSServerDown
        # the exporter stays up when its server is down; it then reports
        # gnatsd_healthz_status_value{value="unreachable"} instead of
        # value="ok" (checked on the local stack)
        expr: |
          (up{job="nats"} == 0)
          or (up{job="nats"} == 1 unless on (node) (gnatsd_healthz_status_value{value="ok"} == 1))
        for: 2m
        labels: {severity: ticket}
        annotations:
          summary: "nats on {{ $labels.node }} is not healthy"
          runbook: docs/runbooks/alerts.md#natsserverdown

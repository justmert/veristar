---
# promtool test rules for platform.yml. promtool starts the clock at unix 0,
# so day arithmetic below is relative to 1970-01-01 00:00 utc.
rule_files: [../platform.yml]
evaluation_interval: 1m
tests:
  - name: disk, service, umami heartbeat
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node",node="core-1",mountpoint="/",fstype="ext4"}'
        values: '30x5 10x15'
      - series: 'node_filesystem_size_bytes{job="node",node="core-1",mountpoint="/",fstype="ext4"}'
        values: '100x20'
      - series: 'node_filesystem_avail_bytes{job="node",node="core-1",mountpoint="/run",fstype="tmpfs"}'
        values: '1x20'
      - series: 'node_filesystem_size_bytes{job="node",node="core-1",mountpoint="/run",fstype="tmpfs"}'
        values: '100x20'
      - series: 'up{job="replayer",node="core-2"}'
        values: '1 0 0 0 0'
      - series: 'ops_ready_check{job="controlplane",node="core-1",check="umami"}'
        values: '1 0 0 0 0 1'
    alert_rule_test:
      - eval_time: 10m
        alertname: DiskUsageHigh
      - eval_time: 16m
        alertname: DiskUsageHigh
        exp_alerts:
          - exp_labels: {severity: ticket, job: node, node: core-1, mountpoint: /, fstype: ext4}
            exp_annotations:
              summary: "/ on core-1 is 90% full"
              runbook: docs/runbooks/alerts.md#diskusagehigh
      - eval_time: 4m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels: {severity: page, job: replayer, node: core-2}
            exp_annotations:
              summary: "replayer on core-2 does not answer scrapes"
              runbook: docs/runbooks/alerts.md#servicedown
      - eval_time: 4m
        alertname: UmamiHeartbeatFailing
        exp_alerts:
          - exp_labels: {severity: page, job: controlplane, node: core-1, check: umami}
            exp_annotations:
              summary: "the control plane on core-1 gets no umami heartbeat"
              runbook: docs/runbooks/alerts.md#umamiheartbeatfailing
      - eval_time: 5m
        alertname: UmamiHeartbeatFailing
  - name: web aggregation
    interval: 1m
    input_series:
      # succeeded at minute 0 and 60, then fails
      - series: 'jobs_task_last_success_timestamp_seconds{job="jobs",node="core-1",task="aggregate-web"}'
        values: '0x59 3600x200'
    alert_rule_test:
      - eval_time: 3h
        alertname: WebAggregationStale
      - eval_time: 3h30m
        alertname: WebAggregationStale
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "web aggregation has not succeeded for over two hours"
              runbook: docs/runbooks/alerts.md#webaggregationstale
  - name: aggregation never succeeded
    interval: 1m
    input_series:
      - series: 'jobs_leader{job="jobs",node="core-1"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: WebAggregationStale
      - eval_time: 20m
        alertname: WebAggregationStale
        exp_alerts:
          - exp_labels: {severity: ticket, task: aggregate-web}
            exp_annotations:
              summary: "web aggregation has not succeeded for over two hours"
              runbook: docs/runbooks/alerts.md#webaggregationstale
  - name: umami password rotation
    interval: 10m
    input_series:
      # day 0 is rotated; on day 1 (from minute 1440) nothing new is recorded
      - series: 'jobs_umami_rotated_epoch_day{job="jobs",node="core-1"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 23h
        alertname: UmamiPasswordRotationNotRun
      # 00:50 on day 1: inside the hour of slack
      - eval_time: 24h50m
        alertname: UmamiPasswordRotationNotRun
      # 01:20 on day 1, the condition has held for 15 minutes
      - eval_time: 25h20m
        alertname: UmamiPasswordRotationNotRun
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "today's umami password rotation has not been recorded"
              runbook: docs/runbooks/alerts.md#umamipasswordrotationnotrun
  - name: probe checks
    interval: 1m
    input_series:
      - series: 'prober_check_success{job="prober",node="probe-1",check="slo_ingestion"}'
        values: '1 0 0 0 0'
      - series: 'prober_check_success{job="prober",node="probe-1",check="slo_freshness-web"}'
        values: '1 0 0 0 0'
      - series: 'prober_check_success{job="prober",node="probe-1",check="slo_dashboard"}'
        values: '1 1 1 1 1'
      - series: 'prober_check_success{job="prober",node="probe-1",check="nodes_edge-2-in-example-org"}'
        values: '1 0 0 0 0'
    alert_rule_test:
      - eval_time: 4m
        alertname: ProbeIngestionFailing
        exp_alerts:
          - exp_labels: {severity: page, job: prober, node: probe-1, check: slo_ingestion}
            exp_annotations:
              summary: "the probe's web event or otlp metric is not accepted"
              runbook: docs/runbooks/alerts.md#probeingestionfailing
      - eval_time: 4m
        alertname: ProbeFreshnessFailing
        exp_alerts:
          - exp_labels: {severity: page, job: prober, node: probe-1, check: slo_freshness-web}
            exp_annotations:
              summary: "slo_freshness-web: accepted probe events are not visible in the machine api"
              runbook: docs/runbooks/alerts.md#probefreshnessfailing
      - eval_time: 4m
        alertname: ProbeDashboardFailing
      - eval_time: 4m
        alertname: ProbeNodeCheckFailing
        exp_alerts:
          - exp_labels: {severity: page, job: prober, node: probe-1, check: nodes_edge-2-in-example-org}
            exp_annotations:
              summary: "nodes_edge-2-in-example-org fails by address (tls, certificate or http)"
              runbook: docs/runbooks/alerts.md#probenodecheckfailing

  - name: host reboot required and watchdog
    interval: 1m
    input_series:
      - series: 'node_reboot_required{job="node",node="edge-2"}'
        values: '0x60 1x780'
      - series: 'node_reboot_required{job="node",node="edge-1"}'
        values: '0x840'
    alert_rule_test:
      # pending since minute 61, so not yet at 12 hours later
      - eval_time: 12h
        alertname: HostRebootRequired
      - eval_time: 13h5m
        alertname: HostRebootRequired
        exp_alerts:
          - exp_labels: {severity: ticket, job: node, node: edge-2}
            exp_annotations:
              summary: "edge-2 has installed updates that need a reboot"
              runbook: docs/runbooks/alerts.md#hostrebootrequired
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels: {severity: heartbeat}
            exp_annotations:
              summary: "always firing; its absence at the probe means the alerting pipeline is down"
              runbook: docs/runbooks/alerts.md#watchdog

  - name: systemd unit failed
    interval: 1m
    input_series:
      # the leader's verify unit fails at minute 30 (verify or check) and
      # recovers at its next successful run
      - series: 'sa_systemd_unit_failed{job="node",node="core-1",unit="sa-pgbackrest-verify.service"}'
        values: '0x29 1x40 0x20'
      # a replica's backup unit skipped by its ExecCondition stays 0
      - series: 'sa_systemd_unit_failed{job="node",node="core-2",unit="sa-pgbackrest-diff.service"}'
        values: '0x90'
      # a start unit failed for 10 minutes until its retry succeeded
      - series: 'sa_systemd_unit_failed{job="node",node="core-3",unit="sa-core-start.service"}'
        values: '0x9 1x10 0x70'
    alert_rule_test:
      # pending since minute 30, not yet 15 minutes
      - eval_time: 40m
        alertname: SystemdUnitFailed
      - eval_time: 46m
        alertname: SystemdUnitFailed
        exp_alerts:
          - exp_labels: {severity: ticket, job: node, node: core-1, unit: sa-pgbackrest-verify.service}
            exp_annotations:
              summary: "sa-pgbackrest-verify.service failed on core-1"
              runbook: docs/runbooks/alerts.md#systemdunitfailed
      # resolved after the next successful run
      - eval_time: 75m
        alertname: SystemdUnitFailed

  - name: api rollup integrity
    interval: 1m
    input_series:
      - series: 'jobs_api_rollup_orphaned_marks_total{job="jobs",node="core-1"}'
        values: '0x30 2x60'
      - series: 'jobs_api_rollup_drifted_hours_total{job="jobs",node="core-2"}'
        values: '0x30 1x90'
      - series: 'jobs_api_rollup_drifted_hours_total{job="jobs",node="core-1"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 29m
        alertname: APIRollupOrphanedMarks
      - eval_time: 29m
        alertname: APIRollupDriftedHours
      - eval_time: 35m
        alertname: APIRollupOrphanedMarks
        exp_alerts:
          - exp_labels: {severity: ticket, job: jobs, node: core-1}
            exp_annotations:
              summary: "the api rollup on core-1 found pending hours whose minute rows were already gone"
              runbook: docs/runbooks/alerts.md#apirolluporphanedmarks
      - eval_time: 35m
        alertname: APIRollupDriftedHours
        exp_alerts:
          - exp_labels: {severity: ticket, job: jobs, node: core-2}
            exp_annotations:
              summary: "the api rollup on core-2 found hourly rows that disagreed with their minute rows"
              runbook: docs/runbooks/alerts.md#apirollupdriftedhours
      # an hour after the last increase the window no longer holds it
      - eval_time: 100m
        alertname: APIRollupOrphanedMarks
  - name: mcp tool failures
    interval: 1m
    input_series:
      # one call a minute succeeds throughout; failures start at minute 10
      - series: 'controlplane_mcp_tool_calls_total{job="controlplane",node="core-1",tool="get_web_stats",outcome="ok"}'
        values: '0+1x60'
      - series: 'controlplane_mcp_tool_calls_total{job="controlplane",node="core-1",tool="get_web_stats",outcome="unavailable"}'
        values: '0x10 0+1x50'
      # bad input is the client's, never an alert
      - series: 'controlplane_mcp_tool_calls_total{job="controlplane",node="core-2",tool="get_site",outcome="invalid_input"}'
        values: '0+5x60'
      - series: 'controlplane_mcp_tool_calls_total{job="controlplane",node="core-2",tool="get_site",outcome="ok"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: MCPToolFailuresHigh
      - eval_time: 45m
        alertname: MCPToolFailuresHigh
        exp_alerts:
          - exp_labels: {severity: ticket, node: core-1}
            exp_annotations:
              summary: "50% of mcp tool calls on core-1 fail on the server"
              runbook: docs/runbooks/alerts.md#mcptoolfailureshigh
  - name: textfile freshness
    interval: 1m
    input_series:
      # written every minute on core-1; core-2's writer stopped at 0
      - series: 'node_textfile_mtime_seconds{job="node",node="core-1",file="/textfile/systemd.prom"}'
        values: '0+60x40'
      - series: 'node_textfile_mtime_seconds{job="node",node="core-2",file="/textfile/systemd.prom"}'
        values: '0x40'
      # every 10 minutes is fresh; one stopped at 0 is stale after 30
      - series: 'node_textfile_mtime_seconds{job="node",node="core-1",file="/textfile/reboot.prom"}'
        values: '0x9 600x9 1200x9 1800x9 2400x9'
      - series: 'node_textfile_mtime_seconds{job="node",node="core-2",file="/textfile/reboot.prom"}'
        values: '0x49'
      - series: 'node_textfile_mtime_seconds{job="node",node="core-1",file="/textfile/pgbackrest.prom"}'
        values: '0x49'
      - series: 'node_textfile_scrape_error{job="node",node="core-1"}'
        values: '0x4 1x20'
      - series: 'node_textfile_scrape_error{job="node",node="core-2"}'
        values: '0x24'
    alert_rule_test:
      - eval_time: 20m
        alertname: TextfileStale
      - eval_time: 21m
        alertname: TextfileStale
        exp_alerts:
          - exp_labels: {severity: ticket, job: node, node: core-2, file: /textfile/systemd.prom}
            exp_annotations:
              summary: "/textfile/systemd.prom on core-2 was last written 21m 0s ago"
              runbook: docs/runbooks/alerts.md#textfilestale
      - eval_time: 36m
        alertname: TextfileStale
        exp_alerts:
          - exp_labels: {severity: ticket, job: node, node: core-2, file: /textfile/systemd.prom}
            exp_annotations:
              summary: "/textfile/systemd.prom on core-2 was last written 36m 0s ago"
              runbook: docs/runbooks/alerts.md#textfilestale
          - exp_labels: {severity: ticket, job: node, node: core-2, file: /textfile/reboot.prom}
            exp_annotations:
              summary: "/textfile/reboot.prom on core-2 was last written 36m 0s ago"
              runbook: docs/runbooks/alerts.md#textfilestale
      - eval_time: 19m
        alertname: TextfileScrapeError
      - eval_time: 20m
        alertname: TextfileScrapeError
        exp_alerts:
          - exp_labels: {severity: ticket, job: node, node: core-1}
            exp_annotations:
              summary: "node_exporter on core-1 cannot read a textfile"
              runbook: docs/runbooks/alerts.md#textfilescrapeerror
  - name: hourly textfiles
    interval: 1m
    input_series:
      # pgbackrest.prom stopped at 0; tls.prom is written every hour
      - series: 'node_textfile_mtime_seconds{job="node",node="core-1",file="/textfile/pgbackrest.prom"}'
        values: '0x200'
      - series: 'node_textfile_mtime_seconds{job="node",node="core-1",file="/textfile/tls.prom"}'
        values: '0x59 3600x59 7200x80'
    alert_rule_test:
      - eval_time: 2h
        alertname: TextfileStale
      - eval_time: 2h10m
        alertname: TextfileStale
        exp_alerts:
          - exp_labels: {severity: ticket, job: node, node: core-1, file: /textfile/pgbackrest.prom}
            exp_annotations:
              summary: "/textfile/pgbackrest.prom on core-1 was last written 2h 10m 0s ago"
              runbook: docs/runbooks/alerts.md#textfilestale
  - name: internal certificates
    interval: 1m
    input_series:
      # the node certificate expires on day 40; the ca far later
      - series: 'sa_tls_certificate_expiry_timestamp_seconds{job="node",node="core-1",cert="node"}'
        values: '3456000x14600'
      - series: 'sa_tls_certificate_expiry_timestamp_seconds{job="node",node="core-1",cert="ca"}'
        values: '315360000x14600'
    alert_rule_test:
      - eval_time: 240h
        alertname: InternalCertificateExpiringSoon
      - eval_time: 242h
        alertname: InternalCertificateExpiringSoon
        exp_alerts:
          - exp_labels: {severity: ticket, job: node, node: core-1, cert: node}
            exp_annotations:
              summary: "the internal node certificate on core-1 expires in 29d 22h 0m 0s"
              runbook: docs/runbooks/alerts.md#internalcertificateexpiringsoon

---
# alert rules, nodes, platform services, jobs and the probe
groups:
  - name: platform
    rules:
      - alert: DiskUsageHigh
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs"}) > 0.80
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.node }} is {{ $value | humanizePercentage }} full"
          runbook: docs/runbooks/alerts.md#diskusagehigh
      - alert: ServiceDown
        expr: up{job=~"controlplane|replayer|metricswriter|jobs|prober|node|postgres|patroni|caddy|haproxy"} == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.node }} does not answer scrapes"
          runbook: docs/runbooks/alerts.md#servicedown
      - alert: UmamiHeartbeatFailing
        expr: ops_ready_check{job="controlplane",check="umami"} == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "the control plane on {{ $labels.node }} gets no umami heartbeat"
          runbook: docs/runbooks/alerts.md#umamiheartbeatfailing

      # aggregate-web runs hourly; two missed runs and some slack. a jobs
      # leader that never succeeded leaves the series absent, which counts
      # after 15 minutes because a new leader runs every task at once.
      - alert: WebAggregationStale
        expr: |
          (time() - max(jobs_task_last_success_timestamp_seconds{task="aggregate-web"}) > 7800)
          or absent(jobs_task_last_success_timestamp_seconds{task="aggregate-web"})
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "web aggregation has not succeeded for over two hours"
          runbook: docs/runbooks/alerts.md#webaggregationstale
      # the rotation runs shortly after 00:00 utc; one hour of slack
      - alert: UmamiPasswordRotationNotRun
        expr: |
          (((floor(vector(time()) / 86400) - max(jobs_umami_rotated_epoch_day)) >= 1) and ((vector(time()) % 86400) > 3600))
          or absent(jobs_umami_rotated_epoch_day)
        for: 15m
        labels: {severity: page}
        annotations:
          summary: "today's umami password rotation has not been recorded"
          runbook: docs/runbooks/alerts.md#umamipasswordrotationnotrun

      # the probe's own view; gatus alerts on the same results from the
      # probe node, these reach alertmanager from prometheus
      - alert: ProbeIngestionFailing
        expr: prober_check_success{check="slo_ingestion"} == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "the probe's web event or otlp metric is not accepted"
          runbook: docs/runbooks/alerts.md#probeingestionfailing
      - alert: ProbeFreshnessFailing
        expr: prober_check_success{check=~"slo_freshness-web|slo_freshness-api"} == 0
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.check }}: accepted probe events are not visible in the machine api"
          runbook: docs/runbooks/alerts.md#probefreshnessfailing
      - alert: ProbeDashboardFailing
        expr: prober_check_success{check="slo_dashboard"} == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "console, umami host or machine api check fails from the probe"
          runbook: docs/runbooks/alerts.md#probedashboardfailing
      - alert: ProbeNodeCheckFailing
        expr: prober_check_success{check=~"nodes_.*"} == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.check }} fails by address (tls, certificate or http)"
          runbook: docs/runbooks/alerts.md#probenodecheckfailing

      # unattended upgrades install kernel and libc fixes without a reboot,
      # and they apply only after one. the patch target is 24 hours
      # (docs/runbooks/security-patch.md section 6), so a reboot that waits
      # 12 hours is raised with time left to do it (playbooks/reboot.yml)
      - alert: HostRebootRequired
        expr: node_reboot_required == 1
        for: 12h
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.node }} has installed updates that need a reboot"
          runbook: docs/runbooks/alerts.md#hostrebootrequired

      # api rollup integrity (internal/jobs/apirollup). an orphaned mark is
      # a pending hour whose minute partition was already dropped, so its
      # hourly rows can no longer be recomputed; a drifted hour had hourly
      # rows that disagreed with its minute rows without a pending mark (a
      # lost mark). neither should ever happen, so any increase alerts
      - alert: APIRollupOrphanedMarks
        expr: increase(jobs_api_rollup_orphaned_marks_total[1h]) > 0
        labels: {severity: ticket}
        annotations:
          summary: "the api rollup on {{ $labels.node }} found pending hours whose minute rows were already gone"
          runbook: docs/runbooks/alerts.md#apirolluporphanedmarks
      - alert: APIRollupDriftedHours
        expr: increase(jobs_api_rollup_drifted_hours_total[1h]) > 0
        labels: {severity: ticket}
        annotations:
          summary: "the api rollup on {{ $labels.node }} found hourly rows that disagreed with their minute rows"
          runbook: docs/runbooks/alerts.md#apirollupdriftedhours

      # mcp tool calls that fail on the server side (contract 12.7): an
      # internal error, umami or the database unavailable, or the call
      # timeout. a client's bad input (invalid_input, not_found) never
      # counts. the floor of one failing call in about three minutes keeps a
      # single failure on an idle server from paging anyone.
      - alert: MCPToolFailuresHigh
        expr: |
          (
            sum by (node) (rate(controlplane_mcp_tool_calls_total{outcome=~"internal|unavailable|timeout"}[15m]))
              / sum by (node) (rate(controlplane_mcp_tool_calls_total[15m]))
          ) > 0.2
          and sum by (node) (rate(controlplane_mcp_tool_calls_total{outcome=~"internal|unavailable|timeout"}[15m])) > 0.005
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $value | humanizePercentage }} of mcp tool calls on {{ $labels.node }} fail on the server"
          runbook: docs/runbooks/alerts.md#mcptoolfailureshigh

  # always firing. alertmanager sends it to the probe's gatus every minute
  # (alertmanager.yml, route heartbeat), and gatus alerts from outside the
  # main provider when it stops: both prometheus servers, both alertmanagers
  # or the whole core tier down raise an alert nothing inside could send
  - name: watchdog
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels: {severity: heartbeat}
        annotations:
          summary: "always firing; its absence at the probe means the alerting pipeline is down"
          runbook: docs/runbooks/alerts.md#watchdog

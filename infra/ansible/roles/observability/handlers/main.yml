---
# prometheus rereads its config and rules on POST /-/reload (--web.enable-lifecycle).
# on a first converge the container was created moments before, and compose's
# wait only means started: the listener may not be up yet and resets the
# connection (seen in the rotate-local run on a github runner), so the reload
# is retried for up to a minute
- name: Reload prometheus
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/-/reload
    method: POST
    status_code: 200
  register: observability_prometheus_reload
  until: observability_prometheus_reload.status == 200
  retries: 30
  delay: 2

- name: Reload alertmanager
  ansible.builtin.command:
    argv: [docker, compose, --project-directory, "{{ observability_dir }}", kill, --signal, HUP, alertmanager]
  changed_when: true

- name: Restart relay
  ansible.builtin.command:
    argv: [docker, compose, --project-directory, "{{ observability_dir }}", restart, relay]
  changed_when: true

- name: Restart gatus
  ansible.builtin.command:
    argv: [docker, compose, --project-directory, "{{ observability_dir }}", restart, gatus]
  changed_when: true

- name: Reload probe caddy
  ansible.builtin.command:
    argv: [docker, compose, --project-directory, "{{ observability_dir }}", exec, caddy, caddy, reload, --config, /etc/caddy/Caddyfile]
  changed_when: true

- name: Restart prober
  ansible.builtin.command:
    argv: [docker, compose, --project-directory, "{{ observability_dir }}", restart, prober]
  changed_when: true

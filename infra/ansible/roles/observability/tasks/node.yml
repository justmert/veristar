---
# the exporter toolkit's tls settings (node_exporter here, alertmanager and
# postgres_exporter on the core nodes); they reread it on every connection
- name: Create the web config directory
  ansible.builtin.file:
    path: "{{ observability_conf_dir }}/web"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the exporter web configs
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ observability_conf_dir }}/web/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ['web-config.yml'] + (['alertmanager-cluster-tls.yml'] if observability_runs_core else []) }}"

- name: Write the metrics relay config
  ansible.builtin.template:
    src: relay.cfg.j2
    dest: "{{ observability_conf_dir }}/relay.cfg"
    owner: root
    group: root
    mode: "0644"
  vars:
    observability_bind_ip: 0.0.0.0
  notify: Restart relay

# pgbackrest runs in the postgres container; the textfile is read by
# node_exporter. hourly, so a backup shows within the hour and the 26 hour
# alert has slack.
- name: Install the pgbackrest textfile writer
  ansible.builtin.template:
    src: pgbackrest-textfile.py.j2
    dest: /usr/local/sbin/sa-pgbackrest-textfile
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in observability_postgres_hosts

# debian 13 server images ship systemd timers but no cron daemon, so
# /etc/cron.d would hold a file nothing reads (and does not exist)
- name: Install cron for the textfile writer
  ansible.builtin.apt:
    name: cron
    state: present
  when: inventory_hostname in observability_postgres_hosts

- name: Schedule the pgbackrest textfile writer
  ansible.builtin.copy:
    dest: /etc/cron.d/sa-pgbackrest-textfile
    content: |
      # managed by ansible (infra/ansible/roles/observability)
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      7 * * * * root /usr/local/sbin/sa-pgbackrest-textfile
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname in observability_postgres_hosts

# unattended upgrades install security fixes without rebooting
# (roles/base upgrades.yml); a kernel or libc fix applies only after a reboot.
# debian's unattended-upgrades kernel hook creates /var/run/reboot-required.
# this timer turns the file into node_reboot_required for the
# HostRebootRequired alert; playbooks/reboot.yml does the rolling reboot.
- name: Install the reboot-required textfile writer
  ansible.builtin.copy:
    dest: /usr/local/sbin/sa-reboot-required
    content: |
      #!/bin/sh
      # managed by ansible (infra/ansible/roles/observability)
      set -eu
      v=0
      [ -e /var/run/reboot-required ] && v=1
      f={{ observability_conf_dir }}/textfile/reboot.prom
      {
        echo '# HELP node_reboot_required 1 when installed updates wait for a reboot'
        echo '# TYPE node_reboot_required gauge'
        echo "node_reboot_required $v"
      } >"$f.tmp"
      mv "$f.tmp" "$f"
    owner: root
    group: root
    mode: "0755"

- name: Install the reboot-required timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: sa-reboot-required.service
      content: |
        # managed by ansible (infra/ansible/roles/observability)
        [Unit]
        Description=write node_reboot_required for node_exporter

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/sa-reboot-required
    - name: sa-reboot-required.timer
      content: |
        # managed by ansible (infra/ansible/roles/observability)
        [Unit]
        Description=write node_reboot_required every 10 minutes

        [Timer]
        OnBootSec=1min
        OnUnitActiveSec=10min

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  register: observability_reboot_units

- name: Start the reboot-required timer
  ansible.builtin.systemd_service:
    name: sa-reboot-required.timer
    enabled: true
    state: started
    daemon_reload: "{{ observability_reboot_units is changed }}"

# a platform unit in the failed state (a backup, its verify or check, a
# start-at-boot unit) is otherwise visible only in systemctl: in production
# on 2026-11-15 and 16 the backup units of two replicas and a start unit
# stayed failed for two days unnoticed. this timer writes
# sa_systemd_unit_failed for every loaded sa-* unit for the SystemdUnitFailed
# alert. a run skipped by its ExecCondition (the backup units on a replica)
# leaves the unit inactive, not failed, so it counts 0.
- name: Install the failed-units textfile writer
  ansible.builtin.copy:
    dest: /usr/local/sbin/sa-systemd-failed
    content: |
      #!/bin/sh
      # managed by ansible (infra/ansible/roles/observability)
      set -eu
      f={{ observability_conf_dir }}/textfile/systemd.prom
      # columns: unit, load, active, sub, description
      units=$(systemctl list-units --all --plain --no-legend --no-pager 'sa-*')
      {
        echo '# HELP sa_systemd_unit_failed 1 when the platform unit is in the failed state; a run skipped by its ExecCondition is not failed'
        echo '# TYPE sa_systemd_unit_failed gauge'
        printf '%s\n' "$units" | awk 'NF >= 3 && $1 ~ /^sa-/ { printf "sa_systemd_unit_failed{unit=\"%s\"} %d\n", $1, ($3 == "failed") }'
      } >"$f.tmp"
      mv "$f.tmp" "$f"
    owner: root
    group: root
    mode: "0755"

- name: Install the failed-units timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: sa-systemd-failed.service
      content: |
        # managed by ansible (infra/ansible/roles/observability)
        [Unit]
        Description=write sa_systemd_unit_failed for node_exporter

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/sa-systemd-failed
    - name: sa-systemd-failed.timer
      content: |
        # managed by ansible (infra/ansible/roles/observability)
        [Unit]
        Description=write sa_systemd_unit_failed every 5 minutes

        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=5min

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  register: observability_failed_units

- name: Start the failed-units timer
  ansible.builtin.systemd_service:
    name: sa-systemd-failed.timer
    enabled: true
    state: started
    daemon_reload: "{{ observability_failed_units is changed }}"

# the private network's certificates come from playbooks/internal-ca.yml and
# are renewed only when an operator runs it (docs/runbooks/secret-rotation.md),
# so their expiry is otherwise visible nowhere. this timer writes the
# notAfter of the node certificate and of the earliest ca in the trusted
# bundle for the InternalCertificateExpiringSoon alert.
- name: Install openssl for the certificate expiry writer
  ansible.builtin.apt:
    name: openssl
    state: present

- name: Install the internal certificate expiry textfile writer
  ansible.builtin.copy:
    dest: /usr/local/sbin/sa-tls-expiry
    content: |
      #!/bin/sh
      # managed by ansible (infra/ansible/roles/observability)
      set -eu
      f={{ observability_conf_dir }}/textfile/tls.prom
      t=$(mktemp -d)
      trap 'rm -rf "$t"' EXIT
      end() { date -d "$(openssl x509 -noout -enddate -in "$1" | cut -d= -f2)" +%s; }
      # the bundle holds a retired ca beside the new one during a rotation
      awk -v d="$t" '/BEGIN CERTIFICATE/ { n++ } n { print > (d "/ca" n ".pem") }' {{ sa_tls_dir }}/ca/ca.crt
      ca=
      for c in "$t"/ca*.pem; do
        e=$(end "$c")
        if [ -z "$ca" ] || [ "$e" -lt "$ca" ]; then ca=$e; fi
      done
      node=$(end {{ sa_tls_dir }}/root/node.crt)
      {
        echo '# HELP sa_tls_certificate_expiry_timestamp_seconds notAfter of the internal node certificate and of the earliest trusted internal ca'
        echo '# TYPE sa_tls_certificate_expiry_timestamp_seconds gauge'
        echo "sa_tls_certificate_expiry_timestamp_seconds{cert=\"node\"} $node"
        echo "sa_tls_certificate_expiry_timestamp_seconds{cert=\"ca\"} $ca"
      } >"$f.tmp"
      mv "$f.tmp" "$f"
    owner: root
    group: root
    mode: "0755"

- name: Install the internal certificate expiry timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: sa-tls-expiry.service
      content: |
        # managed by ansible (infra/ansible/roles/observability)
        [Unit]
        Description=write sa_tls_certificate_expiry_timestamp_seconds for node_exporter

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/sa-tls-expiry
    - name: sa-tls-expiry.timer
      content: |
        # managed by ansible (infra/ansible/roles/observability)
        [Unit]
        Description=write sa_tls_certificate_expiry_timestamp_seconds every hour

        [Timer]
        OnBootSec=3min
        OnUnitActiveSec=1h

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  register: observability_tls_expiry_units

- name: Start the internal certificate expiry timer
  ansible.builtin.systemd_service:
    name: sa-tls-expiry.timer
    enabled: true
    state: started
    daemon_reload: "{{ observability_tls_expiry_units is changed }}"

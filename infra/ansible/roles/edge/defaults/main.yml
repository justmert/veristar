---
edge_dir: /opt/veristar/edge
edge_conf_dir: /etc/veristar/edge

# jetstream limits per node; a cpx22 has 4 GB of memory
edge_nats_max_memory_store: 512M
edge_nats_max_file_store: 20G

# gateway limits, starting values of docs/reference/gateway-limits.md
edge_gateway_env:
  PROOF_BITS: "12"
  PROOF_REPLAY_LIMIT: "50"
  IPCLUSTER_THRESHOLD: "20"
  VISITOR_EVENTS_PER_HOUR: "600"
  RATE_SITE_PER_SECOND: "200"
  RATE_SITE_BURST: "400"
  RATE_PREFIX_PER_SECOND: "20"
  RATE_PREFIX_BURST: "60"
  GATEWAY_MAX_BODY: "8192"

# collector limits, docs/reference/collector.md
edge_collector_env:
  COLLECTOR_MEMORY_LIMIT_MIB: "512"
  COLLECTOR_MEMORY_SPIKE_MIB: "128"
  COLLECTOR_RATE_REQUESTS_PER_SECOND: "50"
  COLLECTOR_RATE_REQUESTS_BURST: "100"
  COLLECTOR_RATE_ITEMS_PER_SECOND: "50000"
  COLLECTOR_RATE_ITEMS_BURST: "200000"

# infra brings up nats and etcd only (before bootstrap creates the nats
# topology); services brings up the rest
edge_stage: services

# where deploy.yml puts the drain flag; caddy answers 503 on port 80 while it
# exists, which takes the node out of dns (deploy/caddy/assemble.sh)
edge_drain_dir: /etc/veristar/drain

# a converged node (sa_tier node, the three-node layout) runs the core role
# too; its caddy, in the core project, serves the edge sites as well
edge_shares_node: "{{ sa_tier == 'node' }}"

# container users of the upstream images that default to root (plan phase
# 18 hardening). the nats config and the named volumes are owned by them;
# the compose project's volume-owners step hands existing volumes over
edge_nats_uid: 4222
edge_etcd_uid: 2379

# etcd membership (tasks/etcd.yml): the compose volume holding the member's
# data, the marker recording how the member started, and its peer url
edge_etcd_volume: veristar-edge_etcddata
edge_etcd_state_file: "{{ edge_conf_dir }}/etcd-initial-state"
edge_etcd_peer_url: "https://{{ sa_private_ip }}:2380"

# ipv6-only docker network that only caddy joins, so published ipv6 ports
# keep the visitor's address. a unique local prefix: it never
# leaves the node, and every node may use the same one.
edge_public6_subnet: fd53:6100:e::/64

---
- name: Check the edge inputs
  ansible.builtin.assert:
    that:
      - sa_tier in ['edge', 'node']
      - groups['edge'] | length == 3
      - sa_secrets is defined
      - sa_tls in ['cloudflare', 'cloudflare-delegated', 'internal']
      - sa_tls != 'internal' or sa_environment == 'local'
      # cloudflare-delegated: certificates through the old zone's cname during a
      # handover cutover (docs/handover/plan.md section 2.3)
      - sa_tls != 'cloudflare-delegated' or (sa_acme_challenge_domain | default('')) is match('^[a-z0-9_.-]+\\.[a-z]+$')
    fail_msg: >-
      edge needs three edge hosts, the secrets role first, and acme dns-01
      (sa_tls cloudflare) outside the local converge

- name: Name the edge peers
  ansible.builtin.import_tasks: peers.yml

- name: Create the edge directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.owner | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ edge_dir }}", mode: "0755" }
    - { path: "{{ edge_conf_dir }}", mode: "0700" }
    # nats runs as edge_nats_uid and reads its config from here
    - { path: "{{ edge_conf_dir }}/nats", mode: "0700", owner: "{{ edge_nats_uid }}" }
    - { path: "{{ edge_drain_dir }}", mode: "0755" }

- name: Assemble the edge caddyfile on the controller
  ansible.builtin.command:
    argv:
      - sh
      - "{{ playbook_dir }}/../../../deploy/caddy/assemble.sh"
      - edge
      - "{{ playbook_dir }}/../../../deploy/caddy/edge.Caddyfile"
  register: edge_caddyfile
  changed_when: false
  delegate_to: localhost
  run_once: true
  become: false
  when: not edge_shares_node

- name: Install the caddyfile
  ansible.builtin.copy:
    content: "{{ edge_caddyfile.stdout }}\n"
    dest: "{{ edge_dir }}/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  register: edge_caddyfile_file
  when: not edge_shares_node

- name: Write the nats server config
  ansible.builtin.template:
    src: nats.conf.j2
    dest: "{{ edge_conf_dir }}/nats/nats.conf"
    owner: "{{ edge_nats_uid }}"
    group: "{{ edge_nats_uid }}"
    mode: "0600"
  no_log: true
  notify: Reload nats

# deploy.yml also runs this alone on every nats server before the core tier
- name: Install the nats authorization of this release
  ansible.builtin.import_tasks: nats_auth.yml

# a oneshot unit that starts the project's containers once docker is up,
# also run alone by the restart drill (tests/drills/start-unit.sh)
- name: Install the start-at-boot unit
  ansible.builtin.include_tasks: start_unit.yml

- name: Decide how this node's etcd member starts
  ansible.builtin.include_tasks: etcd.yml

- name: Install the weekly etcd defrag
  ansible.builtin.include_tasks: etcd_defrag.yml

- name: Write the compose project
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ edge_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
    validate: docker compose -f %s config --quiet

# pulls are retried on their own: a registry answering one request with an
# error (seen once from quay.io during the local converge) must not fail the
# node, while every other compose failure still does
- name: Pull the edge images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ edge_dir }}"
    files: [compose.yml]
    policy: missing
  register: edge_pull
  until: edge_pull is succeeded
  retries: 5
  delay: 10

- name: Start the edge services
  community.docker.docker_compose_v2:
    project_src: "{{ edge_dir }}"
    files: [compose.yml]
    services: "{{ ['nats', 'etcd'] if edge_stage == 'infra' else omit }}"
    state: present
    pull: missing
    wait: true
    wait_timeout: 300
  register: edge_compose

# caddy reads its config at start; a changed caddyfile is applied in place
- name: Reload caddy after a caddyfile change
  ansible.builtin.command:
    argv: [docker, compose, --project-directory, "{{ edge_dir }}", exec, caddy, caddy, reload, --config, /etc/caddy/Caddyfile]
  when: not edge_shares_node and edge_stage != 'infra' and edge_caddyfile_file is changed and edge_compose is not changed
  changed_when: true

- name: Apply a nats config change now
  ansible.builtin.meta: flush_handlers

# monitoring listens on the node's loopback only (templates/nats.conf.j2)
- name: Wait for jetstream to be current with its meta leader
  ansible.builtin.uri:
    url: "http://127.0.0.1:8222/healthz"
    status_code: 200
  register: edge_nats_health
  until: edge_nats_health.status == 200
  retries: 60
  delay: 2
  changed_when: false

# deploy.yml drains the node first, which turns port 80 to 503 on purpose;
# a drained node is checked behind caddy, at the same composite endpoint.
# on a converged node the caddy comes with the core role, later in the run,
# so the edge health is read from the edge project's own network (nats has
# wget) and the core role then checks port 80
- name: Wait for this node's composite health behind caddy while it is drained
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ edge_dir }}"
      - exec
      - -T
      - "{{ 'nats' if edge_shares_node else 'caddy' }}"
      - wget
      - -q
      - -O
      - /dev/null
      - http://gateway:9090/edgez
  register: edge_drained_health
  until: edge_drained_health.rc == 0
  retries: 90
  delay: 2
  when: edge_stage != 'infra' and (sa_draining | default(false) or edge_shares_node)
  changed_when: false

- name: Wait for this node's composite health on port 80
  ansible.builtin.uri:
    url: "http://{{ sa_public_bind_ipv4 | default(sa_public_ipv4) }}/"
    follow_redirects: none
    status_code: 308
  register: edge_health
  until: edge_health.status == 308
  retries: 60
  delay: 2
  when: edge_stage != 'infra' and not (sa_draining | default(false)) and not edge_shares_node
  changed_when: false

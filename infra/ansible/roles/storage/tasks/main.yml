---
- name: Read the backup settings of the backup role
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../backup/defaults/main.yml"
    name: storage_backup_defaults

- name: Name the backup settings
  ansible.builtin.set_fact:
    storage_mode: "{{ backup_repo_mode | default(storage_backup_defaults.backup_repo_mode) }}"
    storage_retention_full: "{{ (backup_retention_full | default(storage_backup_defaults.backup_retention_full)) | int }}"
    storage_retention_diff: "{{ (backup_retention_diff | default(storage_backup_defaults.backup_retention_diff)) | int }}"

- name: Azure backup storage
  ansible.builtin.include_tasks: azure.yml
  when: storage_mode == 'azure'

- name: S3 stand-in bucket
  ansible.builtin.include_tasks: s3.yml
  when: storage_mode == 's3'

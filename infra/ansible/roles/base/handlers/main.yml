---
- name: Restart ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted

- name: Reload firewall
  ansible.builtin.systemd_service:
    name: sa-firewall
    state: reloaded

- name: Restart chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted

- name: Restart docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted

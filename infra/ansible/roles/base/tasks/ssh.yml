---
- name: Harden sshd
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/10-veristar.conf
    owner: root
    group: root
    mode: "0644"
    # the drop-in alone is a complete config for a syntax check; host keys
    # are the defaults
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Keep sshd running
  ansible.builtin.systemd_service:
    name: ssh
    enabled: true
    state: started

---
# the host firewall matches the cloud firewall (the azure nsg) on the public
# side and adds what the cloud firewall cannot: the nsg allows all traffic
# inside the virtual network, and docker-published ports bypass the input
# chain, so the forward chain drops everything reaching containers from the
# public side except 80 and 443 and, on azure's single interface, the
# private network. its own table and unit are used because debian's nftables.service
# flushes the whole ruleset on stop, which would remove docker's rules.
- name: Do not run debian's ruleset-flushing nftables unit
  ansible.builtin.systemd_service:
    name: nftables
    enabled: false
    state: stopped

- name: Write the host firewall rules
  ansible.builtin.template:
    src: firewall.nft.j2
    dest: /etc/veristar/firewall.nft
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload firewall

- name: Install the firewall unit
  ansible.builtin.copy:
    src: sa-firewall.service
    dest: /etc/systemd/system/sa-firewall.service
    owner: root
    group: root
    mode: "0644"
  register: base_firewall_unit

- name: Start the firewall before docker and the network
  ansible.builtin.systemd_service:
    name: sa-firewall
    enabled: true
    state: started
    daemon_reload: "{{ base_firewall_unit is changed }}"

---
- name: Check the inventory contract (docs/deploy/opentofu.md section 1)
  ansible.builtin.assert:
    that:
      - sa_tier in ['edge', 'core', 'node', 'backup', 'restore', 'probe']
      # the probe sits at another provider and has a public
      # interface only; every other node is on the private network
      - sa_tier == 'probe' or (sa_private_ip is string and sa_private_ip | length > 0)
      - sa_tier == 'probe' or (sa_private_network_cidr is string and sa_private_network_cidr | length > 0)
      - sa_admin_cidrs | length > 0
    fail_msg: >-
      the inventory lacks sa_private_ip, sa_private_network_cidr or
      sa_admin_cidrs, or the host's tier is unknown

- name: Find the public and private interfaces
  ansible.builtin.set_fact:
    base_public_interface: "{{ ansible_facts.default_ipv4.interface }}"
    base_private_interface: >-
      {{ '' if sa_tier == 'probe' else ansible_facts.interfaces
         | map('regex_replace', '-', '_')
         | map('extract', ansible_facts)
         | selectattr('ipv4', 'defined')
         | selectattr('ipv4.address', 'equalto', sa_private_ip)
         | map(attribute='device') | first | default('') }}

# azure gives a vm one interface with its private address and maps the
# public address onto it (1:1 nat), so there both are the same interface;
# elsewhere the private network has its own interface
- name: Require the private interface
  when: sa_tier != 'probe'
  ansible.builtin.assert:
    that:
      - base_private_interface | length > 0
      - base_private_interface != base_public_interface or sa_provider == 'azure'
    fail_msg: "no interface holds {{ sa_private_ip }}, or it is the default-route interface outside azure"

- name: Install base packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
      - chrony
      - nftables
      - ca-certificates
      - curl
      - gnupg
      # ansible.builtin.deb822_repository needs it
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the platform configuration directory
  ansible.builtin.file:
    path: /etc/veristar
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Import unattended upgrades
  ansible.builtin.import_tasks: upgrades.yml

- name: Import ssh hardening
  ansible.builtin.import_tasks: ssh.yml

- name: Import host firewall
  ansible.builtin.import_tasks: firewall.yml

- name: Import time sync
  ansible.builtin.import_tasks: time.yml

- name: Import docker engine
  ansible.builtin.import_tasks: docker.yml

---
# this node's certificate of the private network. the file
# comes from playbooks/internal-ca.yml and is decrypted on the controller,
# like secrets.enc.yaml; only this node's own key travels to it.
- name: Require the certificate file
  ansible.builtin.assert:
    that:
      - secrets_tls_file is file
    fail_msg: >-
      {{ secrets_tls_file }} does not exist: issue the private network's
      certificates first with make internal-ca ENV={{ sa_environment }}
      (docs/deploy/secrets.md)
  delegate_to: localhost
  become: false

- name: Decrypt the certificate file
  community.sops.load_vars:
    file: "{{ secrets_tls_file }}"
    name: secrets_tls_doc
    sops_binary: "{{ secrets_tools_dir }}/sops-{{ sops_version }}"
    age_keyfile: "{{ secrets_age_keyfile }}"
  no_log: true

- name: Check the certificate file covers this node
  ansible.builtin.assert:
    that:
      - secrets_tls_doc.sa_tls_environment == sa_environment
      - secrets_tls_doc.nodes[inventory_hostname] is defined
      - secrets_tls_doc.ca_bundle is search('BEGIN CERTIFICATE')
    fail_msg: >-
      {{ secrets_tls_file }} belongs to another environment or has no
      certificate for {{ inventory_hostname }}; run make internal-ca
      ENV={{ sa_environment }} after changing the inventory
    quiet: true

# compose labels carry this value, so a new certificate or ca bundle
# recreates the containers that read them (roles/edge, core, observability)
- name: Name the installed certificate
  ansible.builtin.set_fact:
    secrets_tls_fingerprint: "{{ (secrets_tls_doc.ca_bundle ~ secrets_tls_doc.nodes[inventory_hostname].cert) | hash('sha256') }}"

- name: Create the tls directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: ["{{ sa_tls_dir }}", "{{ sa_tls_dir }}/ca"]

# services that only check the servers they dial (the go services, umami)
# read the bundle from here
- name: Install the ca bundle for every container
  ansible.builtin.copy:
    content: "{{ secrets_tls_doc.ca_bundle }}"
    dest: "{{ sa_tls_dir }}/ca/ca.crt"
    owner: root
    group: root
    mode: "0644"

- name: Create one directory per container user
  ansible.builtin.file:
    path: "{{ sa_tls_dir }}/{{ item.key }}"
    state: directory
    owner: "{{ item.value }}"
    group: "{{ item.value }}"
    mode: "0500"
  loop: "{{ sa_tls_consumers[sa_tier] | dict2items }}"

# the key is readable by its container user only; postgresql and etcd
# refuse a key that others can read
- name: Install the certificate and key for each container user
  ansible.builtin.copy:
    content: "{{ item.1.content }}"
    dest: "{{ sa_tls_dir }}/{{ item.0.key }}/{{ item.1.name }}"
    owner: "{{ item.0.value }}"
    group: "{{ item.0.value }}"
    mode: "{{ item.1.mode }}"
  loop: >-
    {{ sa_tls_consumers[sa_tier] | dict2items | product([
         {'name': 'ca.crt', 'content': secrets_tls_doc.ca_bundle, 'mode': '0444'},
         {'name': 'node.crt', 'content': secrets_tls_cert, 'mode': '0444'},
         {'name': 'node.key', 'content': secrets_tls_key, 'mode': '0400'},
         {'name': 'node.pem', 'content': secrets_tls_cert ~ secrets_tls_key, 'mode': '0400'}]) | list }}
  vars:
    secrets_tls_cert: "{{ secrets_tls_doc.nodes[inventory_hostname].cert | trim }}\n"
    secrets_tls_key: "{{ secrets_tls_doc.nodes[inventory_hostname].key | trim }}\n"
  loop_control:
    label: "{{ item.0.key }}/{{ item.1.name }}"
  no_log: true

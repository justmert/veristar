---
- name: Install sops and age on the controller
  ansible.builtin.import_tasks: tools.yml

# decryption happens on the controller with the operator's age identity;
# the values travel to the nodes only inside the files written below
- name: Decrypt the environment's secrets
  community.sops.load_vars:
    file: "{{ secrets_file }}"
    name: sa_secrets
    sops_binary: "{{ secrets_tools_dir }}/sops-{{ sops_version }}"
    age_keyfile: "{{ secrets_age_keyfile }}"
  no_log: true

- name: Check the file belongs to this environment
  ansible.builtin.assert:
    that:
      - sa_secrets.sa_secrets_environment == sa_environment
    fail_msg: "{{ secrets_file }} was generated for another environment"

- name: Check every generated secret is present
  ansible.builtin.assert:
    that:
      - sa_secrets[item] is defined
      - sa_secrets[item] | length > 0
    fail_msg: "{{ secrets_file }} lacks {{ item }}; regenerate it with infra/secrets/new-secrets.py"
    quiet: true
  loop: "{{ secrets_generated_keys }}"

- name: Check the operator inputs this node needs (I2 on core, I6 with dns-01)
  ansible.builtin.assert:
    that:
      - sa_secrets[item] is defined
      - sa_secrets[item] | length > 0
    fail_msg: >-
      {{ secrets_file }} lacks {{ item }}, an owner input
      ({{ secrets_input_names[item] }}); add it as described in docs/deploy/secrets.md
    quiet: true
  loop: "{{ secrets_required_inputs }}"

# the probe has no private network and so no certificate
- name: Install this node's certificate of the private network
  ansible.builtin.include_tasks: tls.yml
  when: sa_tier != 'probe'

- name: Create the env file directory
  ansible.builtin.file:
    path: "{{ secrets_env_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the root-only env files of this tier
  ansible.builtin.template:
    src: "{{ item }}.env.j2"
    dest: "{{ secrets_env_dir }}/{{ item }}.env"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ secrets_env_files[sa_tier] }}"
  no_log: true

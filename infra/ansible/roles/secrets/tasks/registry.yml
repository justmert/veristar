---
# docker keeps the credential in /root/.docker/config.json, which this task
# keeps at 0600 (root only). the login runs only when the stored credential
# differs from the token in the sops file, so a converge reports no change
# when nothing rotated.
- name: Read the stored registry credential
  ansible.builtin.slurp:
    src: /root/.docker/config.json
  register: secrets_docker_config
  failed_when: false
  no_log: true

- name: Sign in to the registry with the pull token
  ansible.builtin.command:
    argv: [docker, login, "{{ sa_registry_login }}", --username, "{{ sa_registry_login_user }}", --password-stdin]
    stdin: "{{ sa_secrets.ghcr_pull_token }}"
  when: >-
    ((secrets_docker_config.content | default('e30=') | b64decode | from_json).auths | default({}))[sa_registry_login].auth | default('')
    != (sa_registry_login_user ~ ':' ~ sa_secrets.ghcr_pull_token) | b64encode
  changed_when: true
  no_log: true

- name: Keep the registry credential root only
  ansible.builtin.file:
    path: /root/.docker/config.json
    owner: root
    group: root
    mode: "0600"

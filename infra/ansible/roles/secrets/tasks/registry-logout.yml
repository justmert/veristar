---
# public packages need no sign-in. a node that signed in while they were
# private still holds the pull token in /root/.docker/config.json; this
# removes it, so every pull is anonymous and the token can be deleted. the
# logout runs only while a credential for the registry is stored, so a
# converge reports no change afterwards.
- name: Read the stored registry credentials
  ansible.builtin.slurp:
    src: /root/.docker/config.json
  register: secrets_docker_config
  failed_when: false
  no_log: true

- name: Sign out of the image registry
  ansible.builtin.command:
    argv: [docker, logout, "{{ secrets_registry_host }}"]
  when: >-
    secrets_registry_host in
    ((secrets_docker_config.content | default('e30=') | b64decode | from_json).auths | default({}))
  changed_when: true

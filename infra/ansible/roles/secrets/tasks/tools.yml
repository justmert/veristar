---
- name: Create the controller tools directory
  ansible.builtin.file:
    path: "{{ secrets_tools_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  run_once: true
  become: false

- name: Download sops at its pin, checked by sha256
  ansible.builtin.get_url:
    url: "https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-v{{ sops_version }}.linux.amd64"
    dest: "{{ secrets_tools_dir }}/sops-{{ sops_version }}"
    checksum: "sha256:{{ sops_sha256 }}"
    mode: "0755"
  delegate_to: localhost
  run_once: true
  become: false

- name: Download age at its pin, checked by sha256
  ansible.builtin.get_url:
    url: "https://github.com/FiloSottile/age/releases/download/v{{ age_version }}/age-v{{ age_version }}-linux-amd64.tar.gz"
    dest: "{{ secrets_tools_dir }}/age-v{{ age_version }}-linux-amd64.tar.gz"
    checksum: "sha256:{{ age_sha256 }}"
    mode: "0644"
  delegate_to: localhost
  run_once: true
  become: false

- name: Unpack age
  ansible.builtin.unarchive:
    src: "{{ secrets_tools_dir }}/age-v{{ age_version }}-linux-amd64.tar.gz"
    dest: "{{ secrets_tools_dir }}"
    creates: "{{ secrets_tools_dir }}/age/age"
  delegate_to: localhost
  run_once: true
  become: false

- name: Confirm the installed versions
  ansible.builtin.command:
    argv: ["{{ secrets_tools_dir }}/sops-{{ sops_version }}", --version, --disable-version-check]
  register: secrets_sops_version
  changed_when: false
  failed_when: ("sops " ~ sops_version) not in secrets_sops_version.stdout
  delegate_to: localhost
  run_once: true
  become: false

- name: Confirm the age version
  ansible.builtin.command:
    argv: ["{{ secrets_tools_dir }}/age/age", --version]
  register: secrets_age_version
  changed_when: false
  failed_when: secrets_age_version.stdout != ("v" ~ age_version)
  delegate_to: localhost
  run_once: true
  become: false

---
# the sops file of the environment; its creation rules are in
# infra/secrets/.sops.yaml (docs/deploy/secrets.md)
secrets_file: "{{ playbook_dir }}/../../secrets/{{ sa_environment }}/secrets.enc.yaml"
# where the controller keeps the pinned sops and age binaries
secrets_tools_dir: "{{ lookup('env', 'HOME') }}/.local/share/veristar/tools"
# the age identity that decrypts secrets_file on the controller; the nodes
# never hold one. defaults to SOPS_AGE_KEY_FILE, then sops' usual location.
secrets_age_keyfile: "{{ lookup('env', 'SOPS_AGE_KEY_FILE') | default(lookup('env', 'HOME') ~ '/.config/sops/age/keys.txt', true) }}"
# the certificates of the private network (playbooks/internal-ca.yml): the
# trusted ca bundle and this node's key and certificate. the ca key lives in
# ca.enc.yaml beside it, which no role reads.
secrets_tls_file: "{{ playbook_dir }}/../../secrets/{{ sa_environment }}/tls.enc.yaml"

---
# keys infra/secrets/new-secrets.py generates
secrets_generated_keys:
  - postgres_superuser_password
  - postgres_replication_password
  - patroni_restapi_password
  - umami_db_password
  - umami_app_secret
  - umami_admin_password
  - umami_user_password_key
  - umami_db_jobs_retention_password
  - oauth_state_key
  - platform_db_cp_system_password
  - platform_db_cp_tenant_password
  - platform_db_cp_operator_password
  - platform_db_metrics_writer_password
  - platform_db_jobs_password
  - nats_passwords
  - nats_password_hashes
  - nats_route_password
  - nats_route_password_hash

secrets_input_names:
  github_client_id: I2, the github oauth app of this environment
  github_client_secret: I2, the github oauth app of this environment
  bunny_api_key: I6, bunny.net api key for acme dns-01

# the local converge signs in through the test-only oauth fixture
# (docs/deploy/local-converge.md), so it has no github app
secrets_required_inputs: >-
  {{ ((['github_client_id', 'github_client_secret'] if (sa_tier == 'core' and not (core_oauth_fixture | default(false))) else [])
      + (['bunny_api_key'] if sa_tls == 'bunny' else [])) }}

secrets_env_files:
  edge: [gateway, collector, caddy]
  core: [umami, controlplane, replayer, metricswriter, jobs, platformctl, caddy]

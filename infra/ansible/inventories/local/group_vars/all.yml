---
# the local converge (docs/deploy/local-converge.md). every value here is
# local-only and named as such; nothing stands in for a real input of
# another environment.

# images come from the local registry that infra/local/build-images.sh fills
sa_image_registry: 172.31.99.5:5000/sa
sa_image_tag: lc
base_docker_insecure_registries: ["172.31.99.5:5000"]

# no domain an operator input and no bunny.net key an operator input: caddy issues from its
# local ca, and the names under the reserved .test tld resolve only where a
# test maps them to the node addresses
sa_tls: internal

# the nodes are containers sharing this machine's kernel clock, which they
# may not set; chronyd measures the offset (-x) and the check still applies
base_chrony_control_clock: false

# postgresql 18.7 does not exist yet; the local converge
# runs 18.6 and says so here, staging and production are refused
postgres_allow_below_min: true

# no github oauth app an operator input and no operator ids an operator input: sign-in
# goes to the test-only fixture, where a test signs in as user 1001
core_oauth_fixture: true
core_oauth_fixture_image: "{{ sa_image_registry }}/oauth-fixture:{{ sa_image_tag }}"
sa_operator_github_ids: "1001"
# the fixture listens beside caddy on the core node's public address
base_public_tcp_ports: "{{ [80, 443] + ([core_oauth_fixture_port | default(8099)] if sa_tier == 'core' else []) }}"

# the controller decrypts with the throwaway identity up.sh created
secrets_age_keyfile: "{{ playbook_dir }}/../../../.scratch/scratch/local-converge/age.key"

# smaller than a real node: four nodes share one machine
edge_nats_max_memory_store: 256M
edge_nats_max_file_store: 2G
core_postgres_parameters:
  max_connections: 200
  shared_buffers: 256MB
  effective_cache_size: 1GB
  work_mem: 8MB
  maintenance_work_mem: 128MB
  wal_level: replica
  max_wal_senders: 10
  max_replication_slots: 10
  wal_log_hints: "on"
  hot_standby: "on"
  password_encryption: scram-sha-256
  log_line_prefix: "%m [%p] %q%u@%d "
  log_statement: none

# the throwaway admin key and known hosts of the local nodes
ansible_ssh_private_key_file: "{{ inventory_dir }}/../../../../.scratch/scratch/local-converge/id_ed25519"
ansible_ssh_common_args: "-o UserKnownHostsFile={{ inventory_dir }}/../../../../.scratch/scratch/local-converge/known_hosts"

# no object storage an operator input: the pgbackrest repository is a posix
# repository on the backup node, reached over pgbackrest's tls protocol with
# a throwaway ca. a stand-in, not equivalent to hetzner object storage
# (docs/deploy/local-converge.md section 6)
backup_repo_mode: posix-host
backup_tls_controller_dir: "{{ playbook_dir }}/../../../.scratch/scratch/local-converge/pgbackrest-tls"

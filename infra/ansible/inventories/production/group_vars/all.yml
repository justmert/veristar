---
# settings of the azure environments (docs/deploy/ansible.md). hosts.json
# beside this directory is written from the opentofu state by make
# <env>-inventory; these values are the same for every azure node.

# acme dns-01 through caddy-dns/cloudflare with the zone-scoped cloudflare
# token (sops key cloudflare_api_token)
sa_tls: cloudflare

# azure maps a vm's public address onto its one interface (1:1 nat), so the
# address is not on the vm: caddy publishes 80 and 443 on the private
# address, where the mapped traffic arrives
sa_public_bind_ipv4: "{{ sa_private_ip }}"

# images of the release workflow of this repository
sa_image_registry: ghcr.io/justmert/veristar

# numeric github ids of the scf operators, comma separated:
# 37740842 is justmert
sa_operator_github_ids: "37740842"

# stellar accounts (G-addresses) of operators who sign in with a wallet and
# passkey accounts (C-addresses) of operators who sign in with a passkey,
# comma separated (OPERATOR_STELLAR_ADDRESSES); none is configured
sa_operator_stellar_addresses: ""

# the packages on ghcr.io are public, so nodes and the controller pull
# without signing in, and the secrets role removes a stored credential.
# for private packages, set the registry (ghcr.io) and the token's account
# here and add the read:packages token as ghcr_pull_token to the sops file
# (docs/runbooks/secret-rotation.md)
sa_registry_login: ""
sa_registry_login_user: ""

# the probe's status page also checks the documentation site, which is
# hosted apart from the platform (docs/deploy/probe.md)
observability_probe_docs_url: https://docs.veristar.app/

# the probe runs on a shared host outside the inventory; prometheus scrapes
# its prober and gatus metrics through status.veristar.app and alertmanager
# pushes its watchdog heartbeat there (docs/deploy/probe.md section 7)
observability_probe_external: true

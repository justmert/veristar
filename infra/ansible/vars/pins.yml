---
# versions and image references. every play loads this file,
# so a pin changes in one place. upstream images are pinned by tag and index
# digest (resolved 2026-11-12); the platform's own images are named by
# sa_image_registry and sa_image_tag from the inventory.

# docker engine and compose from docker's apt repository for debian trixie
docker_apt_key_fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
docker_ce_version: "5:29.9.3-1~debian.13~trixie"
docker_compose_version: "5.6.1-1~debian.13~trixie"

# controller tools for the secrets role. sops checked against
# sops-v3.13.3.checksums.txt, age against the sha256 digest github publishes
# for the release asset (2026-11-12)
sops_version: 3.13.3
sops_sha256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
age_version: 1.3.2
age_sha256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10

# every upstream image except umami (moved only by make umami-upgrade) also
# has deploy/images/upstream/<name>.Dockerfile, which dependabot watches;
# tests/pins fails when the two differ
upstream_images:
  nats: nats:2.15.3-alpine@sha256:558394a23dd3c36f2d3a64b51865fd09908010e80a542cea5e75c2af543ed62a
  etcd: quay.io/coreos/etcd:v3.6.16@sha256:a9c7cc12156f4b26ca41f0b57ba5b76c45037ff6c1e47ea3d68cb7908d48a965
  # the alpine build of the same release (2026-11-13): the debian build
  # carries zlib1g with two fixable highs (docs/security/supply-chain.md 8.1)
  haproxy: haproxy:3.4.7-alpine@sha256:b9fe316f718d5015c5cfebd8ca019591f3e44656f61d93cb8b59a1028961e530
  umami: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc

# the platform's images, built from deploy/images. postgres-ha carries its
# postgresql version in the tag, because the deploy compares it with
# postgres_min_version below.
platform_images:
  gateway: "{{ sa_image_registry }}/gateway:{{ sa_image_tag }}"
  collector: "{{ sa_image_registry }}/collector:{{ sa_image_tag }}"
  caddy: "{{ sa_image_registry }}/caddy:{{ sa_image_tag }}"
  console: "{{ sa_image_registry }}/console:{{ sa_image_tag }}"
  controlplane: "{{ sa_image_registry }}/controlplane:{{ sa_image_tag }}"
  replayer: "{{ sa_image_registry }}/replayer:{{ sa_image_tag }}"
  metricswriter: "{{ sa_image_registry }}/metricswriter:{{ sa_image_tag }}"
  jobs: "{{ sa_image_registry }}/jobs:{{ sa_image_tag }}"
  platformctl: "{{ sa_image_registry }}/platformctl:{{ sa_image_tag }}"
  # the probe node's (roles/observability)
  prober: "{{ sa_image_registry }}/prober:{{ sa_image_tag }}"
  postgres_ha: "{{ sa_image_registry }}/postgres-ha:{{ postgres_version }}-{{ sa_image_tag }}"

# postgresql. 18.6 is what exists on 2026-11-12; 18.7 fixes
# CVE-2026-120154 and 51 other cves and is required before any non-dev
# environment. the core role refuses to deploy a version
# below postgres_min_version unless the inventory is the local converge,
# which sets postgres_allow_below_min explicitly.
postgres_version: "18.6"
postgres_min_version: "18.7"
patroni_version: 4.1.5
pgbackrest_version: 2.60.0

# shared path: the secrets role writes the root-only env files here and the
# edge and core compose projects read them
secrets_env_dir: /etc/stellar-analytics/env

# shared paths of the private network's tls (, playbooks/
# internal-ca.yml). the secrets role installs, per container user that
# needs them, a directory <sa_tls_dir>/<consumer>/ with ca.crt, node.crt and
# node.key owned by that user (node.pem, certificate and key in one file,
# for haproxy), plus <sa_tls_dir>/ca/ca.crt for services that only check
# servers. root's copy is what ansible and curl on the node use.
sa_tls_dir: /etc/stellar-analytics/tls
sa_tls_consumers:
  edge: {root: 0, nats: 4222, etcd: 2379, haproxy: 99, nobody: 65534}
  core: {root: 0, postgres: 999, haproxy: 99, nobody: 65534}
  backup: {root: 0, postgres: 999}
  restore: {root: 0, postgres: 999}
  probe: {}
# the files root's ansible tasks present to the private endpoints
sa_tls_root:
  ca_path: /etc/stellar-analytics/tls/root/ca.crt
  client_cert: /etc/stellar-analytics/tls/root/node.crt
  client_key: /etc/stellar-analytics/tls/root/node.key
# curl arguments for the same, in shell units and systemd units
sa_tls_curl: >-
  --cacert /etc/stellar-analytics/tls/root/ca.crt
  --cert /etc/stellar-analytics/tls/root/node.crt
  --key /etc/stellar-analytics/tls/root/node.key

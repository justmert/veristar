---
# who signs release images (docs/security/supply-chain.md
# section 3). playbooks/tasks/verify-images.yml accepts a release only when
# every image verifies in the mode below.
sa_signing_repository: justmert/veristar

# keyless (since release v0.2.3, the repository is public): github's oidc
# identity of release-images.yml at the tag, through fulcio and rekor. the
# repository variable SIGNING_MODE=keyless makes the workflow sign this way;
# the two change together.
# key: the release key pair, the mode while the repository was private
# (releases v0.1.0 to v0.2.2). the private key stays in the production sops
# file for a workstation release (docs/security/supply-chain.md section 2.1);
# release-cosign.pub beside this file is the public half. a deploy of such a
# release needs -e sa_signature_mode=key.
sa_signature_mode: keyless
sa_signature_key: "{{ playbook_dir }}/../vars/release-cosign.pub"

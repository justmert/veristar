# local development stack: postgresql, nats with jetstream, umami.
# start it with `make dev-up`, which creates .env.dev with random secrets first.
# images are pinned by tag and index digest (resolved 2026-11-12 with
# `docker buildx imagetools inspect`).
name: stellar-analytics-dev

services:
  postgres:
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make dev-up, which creates deploy/compose/.env.dev}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:?run make dev-up, which creates deploy/compose/.env.dev}
      TZ: UTC
    volumes:
      # postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker, so
      # the volume mounts the parent to survive a later major upgrade
      - pgdata:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      # -h forces tcp, so the temporary socket-only server the entrypoint runs
      # during init does not count as healthy; the query proves init finished
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U postgres -d postgres &&
          [ "$$(psql -h 127.0.0.1 -U postgres -d postgres -tAc
          "select count(*) from pg_database where datname in ('umami','platform')")" = 2 ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  nats:
    image: nats:2.15.3-alpine@sha256:558394a23dd3c36f2d3a64b51865fd09908010e80a542cea5e75c2af543ed62a
    command: ["--name", "dev-1", "--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - natsdata:/data
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      # js-enabled-only fails until jetstream is up, not just the core server
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  umami:
    image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
    depends_on:
      postgres:
        condition: service_healthy
    # environment follows the design REDIS_URL, CLICKHOUSE_URL,
    # KAFKA_URL, CLOUD_MODE, MCP_ENABLED, DISABLE_BOT_CHECK and
    # SKIP_LOCATION_HEADERS stay unset on purpose.
    environment:
      DATABASE_URL: postgresql://umami_app:${UMAMI_DB_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?run make dev-up, which creates deploy/compose/.env.dev}
      CLIENT_IP_HEADER: x-edge-client-ip
      ENABLE_CLIENT_SALT: "1"
      SALT_ROTATION: daily
      PRIVATE_MODE: "1"
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      # blocks only the /login page; /api/auth/login stays reachable for
      # platformctl and the control plane (docker/proxy.ts)
      DISABLE_LOGIN: "1"
      TZ: UTC
    ports:
      # all interfaces so the ui can be opened from another machine on the lan
      - "0.0.0.0:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/heartbeat"]
      interval: 5s
      timeout: 3s
      retries: 24
      # first boot runs every prisma migration before the server listens
      start_period: 120s

  # collect gateway (this stage). in the "edge" profile, because it needs the
  # nats topology that `platformctl nats apply` creates after dev-up; start
  # it with `make gateway-up`. ports bind to loopback only: in production
  # only the local caddy reaches the public port, and here a client that
  # talks to it directly has to set X-Edge-Client-Ip itself.
  gateway:
    profiles: ["edge"]
    build:
      context: ../..
      dockerfile: deploy/images/gateway.Dockerfile
      args:
        # the makefile passes the current utc month; empty fails the build
        DBIP_MONTH: ${DBIP_MONTH:-}
    image: stellar-analytics/gateway:dev
    depends_on:
      nats:
        condition: service_healthy
    # starting values from docs/reference/gateway-limits.md
    environment:
      NATS_URL: nats://nats:4222
      NATS_REPLICAS: "1"
      GATEWAY_NODE_ID: dev-1
      GATEWAY_ADDR: 0.0.0.0:8080
      GATEWAY_OPS_ADDR: 0.0.0.0:9090
      PROOF_BITS: "12"
      PROOF_REPLAY_LIMIT: "50"
      IPCLUSTER_THRESHOLD: "20"
      VISITOR_EVENTS_PER_HOUR: "600"
      RATE_SITE_PER_SECOND: "200"
      RATE_SITE_BURST: "400"
      RATE_PREFIX_PER_SECOND: "20"
      RATE_PREFIX_BURST: "60"
      GATEWAY_MAX_BODY: "8192"
      CLIENT_IP_HEADER: X-Edge-Client-Ip
      # no tls in front in dev, so browsers send no fetch metadata
      GATEWAY_SECURE_TRANSPORT: "false"
      TZ: UTC
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"

  # replayer (this stage): drains WEB_EVENTS into umami's /api/send on the
  # private network. in the "core" profile because it needs the nats topology
  # from `platformctl nats apply`; start it with
  # `docker compose --env-file deploy/compose/.env.dev -f deploy/compose/dev.yml --profile core up -d replayer`.
  # only the ops port is published, on loopback.
  replayer:
    profiles: ["core"]
    build:
      context: ../..
      dockerfile: deploy/images/go-service.Dockerfile
      args:
        CMD: replayer
    image: stellar-analytics/replayer:dev
    depends_on:
      nats:
        condition: service_healthy
      umami:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      NATS_REPLICAS: "1"
      REPLAYER_NODE_ID: dev-1
      REPLAYER_OPS_ADDR: 0.0.0.0:9090
      UMAMI_URL: http://umami:3000
      REPLAYER_WORKERS: "16"
      REPLAYER_MAX_IN_FLIGHT: "512"
      TZ: UTC
    ports:
      - "127.0.0.1:9091:9090"

  # control plane api (this stage). in the "core" profile: it needs the platform
  # database migrated with role passwords (make db-migrate db-roles). port
  # 8085 is the dev oauth callback of an operator input (8080 is the dev gateway). the
  # api is reached directly at http://localhost:8085/api, which is also the
  # console origin, so the host-only session cookie and the csrf origin check
  # see one origin. ops port on loopback only. GITHUB_CLIENT_ID,
  # GITHUB_CLIENT_SECRET an operator input and OPERATOR_GITHUB_IDS an operator input are added
  # to .env.dev by hand; they default to empty here so the other services still
  # start, and the control plane then refuses to start and names each key.
  controlplane:
    profiles: ["core"]
    build:
      context: ../..
      dockerfile: deploy/images/controlplane.Dockerfile
    image: stellar-analytics/controlplane:dev
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      umami:
        condition: service_healthy
    environment:
      CONTROLPLANE_ADDR: 0.0.0.0:8085
      CONTROLPLANE_OPS_ADDR: 0.0.0.0:9090
      CONSOLE_ORIGIN: http://localhost:8085
      INGEST_ORIGIN: http://localhost:8080
      WEB_ORIGIN: http://localhost:3000
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URL: http://localhost:8085/api/auth/github/callback
      OAUTH_STATE_KEY: ${OAUTH_STATE_KEY:?run make dev-env}
      OPERATOR_GITHUB_IDS: ${OPERATOR_GITHUB_IDS:-}
      UMAMI_URL: http://umami:3000
      UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD:?run make dev-env}
      UMAMI_USER_PASSWORD_KEY: ${UMAMI_USER_PASSWORD_KEY:?run make dev-env}
      TRACKER_RELEASE_DIR: /releases
      NATS_URL: nats://nats:4222
      NATS_REPLICAS: "1"
      PLATFORM_DB_HOST: postgres
      PLATFORM_DB_PORT: "5432"
      PLATFORM_DB_NAME: platform
      PLATFORM_DB_SSLMODE: disable
      PLATFORM_DB_CP_SYSTEM_PASSWORD: ${PLATFORM_DB_CP_SYSTEM_PASSWORD:?run make dev-env}
      PLATFORM_DB_CP_TENANT_PASSWORD: ${PLATFORM_DB_CP_TENANT_PASSWORD:?run make dev-env}
      PLATFORM_DB_CP_OPERATOR_PASSWORD: ${PLATFORM_DB_CP_OPERATOR_PASSWORD:?run make dev-env}
      # the same horizons as jobs (control-plane-api 7.11)
      API_MINUTE_RETENTION_DAYS: ${API_MINUTE_RETENTION_DAYS:?run make dev-env}
      API_HOURLY_RETENTION_MONTHS: ${API_HOURLY_RETENTION_MONTHS:?run make dev-env}
      TZ: UTC
    volumes:
      - ../../packages/tracker/releases:/releases:ro
    ports:
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:9095:9090"

  # otlp collector (this stage). in the "edge" profile, because it needs the
  # nats topology from `platformctl nats apply`. ports bind to loopback only:
  # in production only the local caddy reaches them. the dev nats server has
  # no auth, so NATS_USER and NATS_PASSWORD are empty. the image has no
  # shell; readiness is the health check endpoint on 127.0.0.1:13133.
  # limits follow docs/reference/collector.md.
  collector:
    profiles: ["edge"]
    build:
      context: ../..
      dockerfile: deploy/images/collector.Dockerfile
    image: stellar-analytics/collector:dev
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      NATS_USER: ""
      NATS_PASSWORD: ""
      COLLECTOR_GRPC_ADDR: 0.0.0.0:4317
      COLLECTOR_HTTP_ADDR: 0.0.0.0:4318
      COLLECTOR_HEALTH_ADDR: 0.0.0.0:13133
      COLLECTOR_MEMORY_LIMIT_MIB: "512"
      COLLECTOR_MEMORY_SPIKE_MIB: "128"
      COLLECTOR_RATE_REQUESTS_PER_SECOND: "50"
      COLLECTOR_RATE_REQUESTS_BURST: "100"
      COLLECTOR_RATE_ITEMS_PER_SECOND: "50000"
      COLLECTOR_RATE_ITEMS_BURST: "200000"
      TZ: UTC
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"

  # metrics writer (this stage). in the "core" profile: it needs the nats
  # topology (platformctl nats apply) and the platform database migrated with
  # role passwords (make db-migrate db-roles). values follow
  # docs/reference/api-storage.md: batch 256, first-point threshold 120 s,
  # caps of 300 routes and 50 services per tenant and utc day. only the ops
  # port is published, on loopback.
  metricswriter:
    profiles: ["core"]
    build:
      context: ../..
      dockerfile: deploy/images/go-service.Dockerfile
      args:
        CMD: metricswriter
    image: stellar-analytics/metricswriter:dev
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      NATS_REPLICAS: "1"
      PLATFORM_DB_HOST: postgres
      PLATFORM_DB_PORT: "5432"
      PLATFORM_DB_NAME: platform
      PLATFORM_DB_SSLMODE: disable
      PLATFORM_DB_METRICS_WRITER_PASSWORD: ${PLATFORM_DB_METRICS_WRITER_PASSWORD:?run make dev-env}
      METRICSWRITER_NODE_ID: dev-1
      METRICSWRITER_OPS_ADDR: 0.0.0.0:9090
      METRICSWRITER_BATCH: "256"
      METRICSWRITER_FIRST_POINT_THRESHOLD: 120s
      METRICSWRITER_ROUTE_CAP: "300"
      METRICSWRITER_SERVICE_CAP: "50"
      TZ: UTC
    ports:
      - "127.0.0.1:9096:9090"

volumes:
  pgdata:
  natsdata:

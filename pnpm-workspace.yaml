packages:
  - apps/*
  - packages/*
  - examples/*
  # the otel example apps are standalone projects a tenant can copy, each with
  # its own lockfile, so they stay out of the workspace
  - "!examples/otel-*"
  - tests/*

# pinned versions, referenced as "catalog:" so the workspace cannot drift to two versions
catalog:
  "@biomejs/biome": 2.5.15
  "@astrojs/node": 11.1.13
  "@creit.tech/stellar-wallets-kit": 2.8.0
  "@fontsource-variable/inter": 5.3.0
  "@fontsource-variable/jetbrains-mono": 5.3.0
  "@ghostery/adblocker": 2.20.3
  "@playwright/test": 1.64.1
  "@react-router/dev": 8.4.0
  "@react-router/node": 8.4.0
  "@react-router/serve": 8.4.0
  "@soropass/core": 0.3.1
  "@sveltejs/adapter-node": 6.0.2
  "@sveltejs/kit": 3.1.1
  "@sveltejs/vite-plugin-svelte": 7.3.1
  "@stellar/stellar-sdk": 17.4.0
  "@tailwindcss/vite": 4.3.5
  "@tanstack/react-query": 5.106.1
  "@types/node": 26.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.2.1
  "@vitejs/plugin-vue": 6.0.11
  astro: 7.4.12
  class-variance-authority: 0.7.1
  cn: 0.5.2
  esbuild: 0.28.2
  isbot: 5.2.3
  jsdom: 30.1.3
  lucide-react: 1.69.0
  motion: 14.14.0
  next: 16.4.6
  radix-ui: 1.8.1
  react: 19.3.1
  react-dom: 19.3.1
  react-router: 8.4.0
  recharts: 3.10.1
  shadcn: 4.22.2
  svelte: 5.57.3
  tailwindcss: 4.3.5
  tw-animate-css: 1.4.0
  typescript: 7.0.2
  vite: 8.3.8
  vitest: 5.0.5
  vue: 3.5.45
  vue-router: 5.4.0
  zod: 4.6.7

# transitive versions moved past a security advisory. the parents pin an older
# major, so a plain update cannot reach the fixed release
overrides:
  # GHSA-mrhx-c7xc-m3w5: zod 3 under the wallets kit (@reown/appkit-wallet,
  # @coinbase/cdp-sdk). their schemas use only calls zod 4 keeps
  "zod@<4.6.6": "catalog:"
  # jayson 5 drops stream-json (GHSA-528h-pc64-c93x, GHSA-mjw6-4jj6-33hc,
  # GHSA-hqr4-qq8f-hg3x) and uuid 8 (GHSA-w5hq-g745-h8pq). @solana/web3.js
  # uses only jayson/lib/client/browser, whose interface 5.0.0 keeps
  "jayson@4": 5.0.0
  # @lobstrco/signer-extension-api 2.0.0, which the wallets kit's lobstr
  # module pins, is gpl-3.0 and is bundled into the console. 3.0.0 is
  # apache-2.0 and keeps the four calls the module makes (getPublicKey,
  # isConnected, signTransaction, signMessage) with the same arguments; its
  # new network option defaults to stellar
  "@lobstrco/signer-extension-api@2.0.0": 3.0.0

# exact versions only, the pin policy does not allow ranges
saveExact: true
# fail on a node version outside engines instead of warning
engineStrict: true
# set explicitly because the built-in 1440 default is non-strict and silently excludes too-new versions
minimumReleaseAge: 1440
# unknown install scripts fail the install instead of being skipped quietly
strictDepBuilds: true
allowBuilds:
  # postinstall only verifies the platform binary; the tracker build needs it
  esbuild: true
  # pulled in by @creit.tech/stellar-wallets-kit. none is needed:
  # appkit's script is a postinstall notice, bufferutil and utf-8-validate are
  # optional native speedups of ws, and secp256k1 falls back to its js build.
  "@reown/appkit": false
  bufferutil: false
  secp256k1: false
  utf-8-validate: false

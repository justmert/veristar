name: release-image
description: >
  build and push one platform image, gate it with syft and trivy, then sign
  it with cosign: with the release key and no transparency log, which keeps
  the image names and digests of a private repository out of the public log
  (signing-mode key), or keyless with build provenance and sbom attestations
  for a public repository (signing-mode keyless). used by
  release-images.yml for every image, so each one passes the same steps.

inputs:
  name:
    description: image name under ghcr.io/<owner>/<repo>/
    required: true
  dockerfile:
    description: path of the dockerfile
    required: true
  context:
    description: build context
    required: true
  build-args:
    description: build arguments, one KEY=value per line (may be empty)
    required: false
    default: ""
  token:
    description: token for ghcr
    required: true
  signing-mode:
    description: key (release key pair, no rekor upload) or keyless (fulcio, rekor, github attestations)
    required: true
  cosign-key:
    description: the release private key (cosign format), signing-mode key only
    required: false
    default: ""
  cosign-password:
    description: the password of the release private key, signing-mode key only
    required: false
    default: ""

outputs:
  digest:
    description: the pushed image digest
    value: ${{ steps.build.outputs.digest }}
  repo:
    description: the image repository without tag
    value: ${{ steps.ref.outputs.repo }}

runs:
  using: composite
  steps:
    - id: ref
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      run: |
        # ghcr names must be lower case; the repository owner may not be
        repo="ghcr.io/${REPO,,}/${NAME}"
        tag="$TAG"
        # postgres-ha carries its postgresql version first, matching
        # postgres_version in infra/ansible/vars/pins.yml
        if [ "$NAME" = postgres-ha ]; then
          pg="$(sed -n 's/^ARG PG_VERSION=//p' deploy/images/postgres-ha.Dockerfile)"
          tag="${pg}-${TAG}"
        fi
        echo "repo=$repo" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        build-args: |
          VERSION=${{ github.ref_name }}
          ${{ inputs.build-args }}
        tags: ${{ steps.ref.outputs.repo }}:${{ steps.ref.outputs.tag }}
        push: true
        # provenance comes from actions/attest below, signed for this
        # workflow's identity; buildkit's unsigned attestation adds nothing
        provenance: false
        sbom: false
    - name: install syft and trivy with checksum verification
      shell: bash
      run: scripts/supply-chain/install-tools.sh "$RUNNER_TEMP/bin" syft trivy && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
    # the gate: a fixable critical or high finding stops the job before the
    # image is signed
    - name: sbom and vulnerability gate
      shell: bash
      env:
        REF: ${{ steps.ref.outputs.repo }}@${{ steps.build.outputs.digest }}
      run: scripts/supply-chain/scan-image.sh "$REF" "$RUNNER_TEMP/scan"
    - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        cosign-release: v3.1.4
    - name: refuse an unknown signing mode
      shell: bash
      env:
        MODE: ${{ inputs.signing-mode }}
        KEY: ${{ inputs.cosign-key }}
      run: |
        case "$MODE" in
          keyless) ;;
          key) [ -n "$KEY" ] || { echo "signing-mode key needs the COSIGN_PRIVATE_KEY secret" >&2; exit 1; } ;;
          *) echo "signing-mode must be key or keyless, got '$MODE'" >&2; exit 1 ;;
        esac
    # key mode: nothing goes to the public rekor log, so the private
    # repository's image names and digests stay private. deploy verifies
    # with the committed public key (infra/ansible/vars/release-cosign.pub)
    - name: key signature, no transparency log
      if: inputs.signing-mode == 'key'
      shell: bash
      env:
        REF: ${{ steps.ref.outputs.repo }}@${{ steps.build.outputs.digest }}
        COSIGN_PRIVATE_KEY: ${{ inputs.cosign-key }}
        COSIGN_PASSWORD: ${{ inputs.cosign-password }}
      run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY --use-signing-config=false --tlog-upload=false "$REF"
    - name: sbom attestation with the release key, no transparency log
      if: inputs.signing-mode == 'key'
      shell: bash
      env:
        REF: ${{ steps.ref.outputs.repo }}@${{ steps.build.outputs.digest }}
        COSIGN_PRIVATE_KEY: ${{ inputs.cosign-key }}
        COSIGN_PASSWORD: ${{ inputs.cosign-password }}
      run: |
        sbom="$RUNNER_TEMP/scan/$(printf '%s' "$REF" | tr '/:@' '___').spdx.json"
        cosign attest --yes --key env://COSIGN_PRIVATE_KEY --use-signing-config=false --tlog-upload=false \
          --type spdxjson --predicate "$sbom" "$REF"
    - name: keyless signature
      if: inputs.signing-mode == 'keyless'
      shell: bash
      env:
        REF: ${{ steps.ref.outputs.repo }}@${{ steps.build.outputs.digest }}
      run: cosign sign --yes "$REF"
    # github artifact attestations need a public repository (or enterprise
    # cloud), so they run in keyless mode only
    - name: build provenance attestation
      if: inputs.signing-mode == 'keyless'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ steps.ref.outputs.repo }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true
    - name: sbom attestation
      if: inputs.signing-mode == 'keyless'
      shell: bash
      id: sbom
      env:
        REF: ${{ steps.ref.outputs.repo }}@${{ steps.build.outputs.digest }}
      run: echo "path=$RUNNER_TEMP/scan/$(printf '%s' "$REF" | tr '/:@' '___').spdx.json" >> "$GITHUB_OUTPUT"
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      if: inputs.signing-mode == 'keyless'
      with:
        subject-name: ${{ steps.ref.outputs.repo }}
        subject-digest: ${{ steps.build.outputs.digest }}
        sbom-path: ${{ steps.sbom.outputs.path }}
        push-to-registry: true
    - name: record the digest for the release manifest
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        REPO: ${{ steps.ref.outputs.repo }}
        TAG: ${{ steps.ref.outputs.tag }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p "$RUNNER_TEMP/digest"
        printf '{"name":"%s","repo":"%s","tag":"%s","digest":"%s"}\n' "$NAME" "$REPO" "$TAG" "$DIGEST" > "$RUNNER_TEMP/digest/$NAME.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: digest-${{ inputs.name }}
        path: ${{ runner.temp }}/digest/${{ inputs.name }}.json
        retention-days: 7
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: scan-${{ inputs.name }}
        path: ${{ runner.temp }}/scan
        retention-days: 90

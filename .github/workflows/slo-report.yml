name: slo-report

# gatus keeps raw probe results for about a week and hourly
# uptime for only 30 days, shorter than a month, so each day's raw results
# are copied into docs/slo/data/ on the branch slo/<YYYY-MM>. every run also
# collects the earlier days of the last six that are still missing, so a
# failed run is caught up by the next one. once a month's last day is stored
# the report is written on the same branch and a pull request to main is
# opened.

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: utc day to collect (YYYY-MM-DD); default every missing day of the last six
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: slo-report
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    env:
      # the status page host follows BASE_DOMAIN
      STATUS_BASE_URL: ${{ vars.STATUS_BASE_URL }}
      GH_TOKEN: ${{ github.token }}
      INPUT_DAY: ${{ inputs.day }}
    steps:
      - name: require the status page url
        run: |
          if [ -z "$STATUS_BASE_URL" ]; then
            echo "repository variable STATUS_BASE_URL is not set (https://status.<BASE_DOMAIN>)" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # collects every day of the catch-up window that has no data file yet
      # (or only the requested day) and writes a month's report once its
      # last day is stored (scripts/slo-collect.sh)
      - name: collect and report
        run: scripts/slo-collect.sh run "$INPUT_DAY"

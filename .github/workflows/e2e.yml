name: e2e

# the end-to-end and container suites that are too slow for every pull
# request. ci.yml already gates every
# change on make test, make test-containers, the isolation gate, the
# supply-chain check, test-integration and the promtool rule tests; this
# workflow runs every other suite each night and on demand, one matrix job
# per make target, so a failure names its suite.

on:
  schedule:
    - cron: "23 1 * * *"
  # a single failed suite is rerun from the run page (re-run failed jobs)
  # on demand: gh api -X POST repos/justmert/veristar/actions/workflows/e2e.yml/dispatches -f ref=main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suite:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # browsers: node, pnpm and the playwright browsers; geo: the db-ip
        # country file and the network data of the month; devstack: make dev-up and umami-bootstrap first;
        # devenv: only the generated .env.dev; ansible: the controller venv
        # (uv, sops, age)
        include:
          - suite: gateway-it
            timeout: 75
            browsers: true
            geo: true
          - suite: test-caddy-closed
            timeout: 30
          - suite: umami-compat
            timeout: 30
            devstack: true
          - suite: webpath
            timeout: 130
            browsers: true
            geo: true
          - suite: console-e2e
            timeout: 75
            browsers: true
            geo: true
          - suite: handover-it
            timeout: 100
            browsers: true
            geo: true
          - suite: enrollment-it
            timeout: 40
            geo: true
          - suite: recovery-it
            timeout: 40
            geo: true
            devstack: true
          - suite: db-it
            timeout: 20
            devstack: true
          - suite: collector-it
            timeout: 30
          - suite: metricswriter-it
            timeout: 35
          - suite: otelapps
            timeout: 70
          - suite: apipath
            timeout: 100
          - suite: api-volume
            timeout: 130
            devenv: true
          - suite: privacy
            timeout: 40
            geo: true
          - suite: local-converge
            timeout: 120
            ansible: true
            geo: true
          - suite: rotate-local
            timeout: 120
            ansible: true
            geo: true
    env:
      DBIP_MMDB: ${{ github.workspace }}/.scratch/geo/dbip-country-lite.mmdb
      # the gateway image builds take the month's files from the geo step
      # below (tests/fixtures/gatewayimage, infra/local/build-images.sh)
      GATEWAY_GEO_DIR: ${{ matrix.geo && format('{0}/.scratch/geo', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the suites build platform images and start whole stacks; the runner
      # image leaves too little disk for that and ships an older docker
      # engine than production (scripts/ci/)
      - run: scripts/ci/free-disk.sh
      - run: scripts/ci/install-docker.sh
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - if: matrix.browsers
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: matrix.browsers
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      - if: matrix.browsers
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ./tests/e2e exec playwright install --with-deps chromium firefox webkit
      # the month's geo and network data, downloaded once per month and kept in
      # the actions cache: db-ip refuses some downloads from shared runner
      # addresses with 403, so every job fetching its own copy failed at random
      - if: matrix.geo
        id: geo-month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - if: matrix.geo
        id: geo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .scratch/geo
          key: geo-${{ steps.geo-month.outputs.month }}-${{ hashFiles('scripts/fetch-dbip.sh', 'scripts/fetch-network.sh', 'scripts/dbipcheck/**', 'scripts/netdata/**') }}
      - if: matrix.geo && steps.geo-cache.outputs.cache-hit != 'true'
        run: make geo-fetch GEO_MONTH=${{ steps.geo-month.outputs.month }}
      - if: matrix.devenv
        run: make dev-env
      - if: matrix.devstack
        run: |
          make dev-up
          make umami-bootstrap
      # uv builds the controller venv; the runner image does not pin it
      - if: matrix.ansible
        run: |
          scripts/supply-chain/install-tools.sh "$RUNNER_TEMP/bin" uv
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - if: matrix.ansible
        run: make ansible-venv

      # webpath copies the output of a failed playwright run here
      # (WEBPATH_LOGS), which the artifact step below uploads
      - if: matrix.suite != 'local-converge'
        env:
          WEBPATH_LOGS: ${{ github.workspace }}/.scratch/webpath-logs
        run: |
          mkdir -p "$WEBPATH_LOGS"
          make "${{ matrix.suite }}"

      # docs/deploy/local-converge.md section 2: the test receiver stands in
      # for the discord alert webhook that the observability play needs
      - if: matrix.suite == 'local-converge'
        run: |
          make local-converge-up
          make local-converge-images
          go run ./tests/observability/receiver -listen 10.98.99.1:8099 > "$RUNNER_TEMP/receiver.log" 2>&1 &
          make local-converge ANSIBLE_EXTRA='-e observability_test_webhook_base=http://10.98.99.1:8099'
          make local-converge-e2e

      # suite logs, saved container logs and playwright results of a failure
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.suite }}
          path: |
            .scratch/**/*.log
            tests/**/test-results/
            !**/node_modules/**
          if-no-files-found: ignore
          # .scratch is a dot directory, which upload-artifact skips by default
          include-hidden-files: true
          retention-days: 14
      - if: failure() && matrix.devstack
        run: docker compose --env-file deploy/compose/.env.dev -f deploy/compose/dev.yml logs --tail 200
      - if: always() && matrix.suite == 'local-converge'
        run: make local-converge-down

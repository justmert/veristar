name: release-images

# builds, scans, signs and attests every platform image for a release tag
# (docs/security/supply-chain.md). each image is pushed to
# ghcr, then gated: syft sbom, trivy fails on a critical or high finding that
# has a fix. only an image that passed is signed with a keyless cosign
# signature (fulcio certificate for this workflow's oidc identity, logged in
# rekor) and gets a build provenance and an sbom attestation. an image that
# failed stays in the registry unsigned, and deploy.yml refuses unsigned
# digests, so it can never be deployed.
#
# the last job writes release-images.json (name, reference, digest) to the
# github release. deploy.yml reads that file and deploys by digest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  SYFT_VERSION: 1.57.1
  # key for a private repository (release key pair, nothing in the public
  # rekor log), keyless for a public one; repository variable
  # SIGNING_MODE, docs/security/supply-chain.md section 3
  SIGNING_MODE: ${{ vars.SIGNING_MODE || 'key' }}
  TRIVY_VERSION: 0.76.2
  COSIGN_VERSION: v3.1.4

jobs:
  # caddy first: the console image is built on top of this release's caddy
  caddy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.release.outputs.digest }}
      repo: ${{ steps.release.outputs.repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: release
        uses: ./.github/actions/release-image
        with:
          name: caddy
          dockerfile: deploy/images/caddy.Dockerfile
          context: deploy/images
          build-args: ""
          token: ${{ secrets.GITHUB_TOKEN }}
          signing-mode: ${{ env.SIGNING_MODE }}
          cosign-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}

  images:
    needs: caddy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, dockerfile: deploy/images/gateway.Dockerfile, context: ".", args: "DBIP_MONTH=from-tag" }
          - { name: collector, dockerfile: deploy/images/collector.Dockerfile, context: ".", args: "" }
          - { name: controlplane, dockerfile: deploy/images/controlplane.Dockerfile, context: ".", args: "" }
          - { name: replayer, dockerfile: deploy/images/go-service.Dockerfile, context: ".", args: "CMD=replayer" }
          - { name: metricswriter, dockerfile: deploy/images/go-service.Dockerfile, context: ".", args: "CMD=metricswriter" }
          - { name: jobs, dockerfile: deploy/images/go-service.Dockerfile, context: ".", args: "CMD=jobs" }
          - { name: platformctl, dockerfile: deploy/images/go-service.Dockerfile, context: ".", args: "CMD=platformctl" }
          - { name: prober, dockerfile: deploy/images/go-service.Dockerfile, context: ".", args: "CMD=prober" }
          - { name: console, dockerfile: deploy/images/console.Dockerfile, context: ".", args: "CADDY_IMAGE=from-caddy-job" }
          - { name: postgres-ha, dockerfile: deploy/images/postgres-ha.Dockerfile, context: deploy/images, args: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # placeholders in the matrix are resolved here, because a matrix entry
      # cannot read another job's output or the tag
      - id: args
        env:
          ARGS: ${{ matrix.args }}
          CADDY: ${{ needs.caddy.outputs.repo }}@${{ needs.caddy.outputs.digest }}
        run: |
          case "$ARGS" in
            DBIP_MONTH=from-tag)
              # the db-ip month is a release input: the tag's commit date month,
              # so a re-run of the same tag picks the same file
              month="$(git log -1 --format=%cd --date=format:%Y-%m "$GITHUB_SHA")"
              echo "value=DBIP_MONTH=$month" >> "$GITHUB_OUTPUT" ;;
            CADDY_IMAGE=from-caddy-job) echo "value=CADDY_IMAGE=$CADDY" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=$ARGS" >> "$GITHUB_OUTPUT" ;;
          esac
      - id: release
        uses: ./.github/actions/release-image
        with:
          name: ${{ matrix.name }}
          dockerfile: ${{ matrix.dockerfile }}
          context: ${{ matrix.context }}
          build-args: ${{ steps.args.outputs.value }}
          token: ${{ secrets.GITHUB_TOKEN }}
          signing-mode: ${{ env.SIGNING_MODE }}
          cosign-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}

  # the third-party licence report of the tag (docs/security/supply-chain.md
  # section 7), attached to the release beside release-images.json so each
  # release records the licences of what it ships. a failing gate stops the
  # release before the manifest is published
  licences:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      # trivy reads licences from the module cache and node_modules
      - run: pnpm install --frozen-lockfile
      - run: scripts/supply-chain/install-tools.sh "$RUNNER_TEMP/bin" trivy
      - run: PATH="$RUNNER_TEMP/bin:$PATH" scripts/supply-chain/licence-gate.sh licence-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licence-report
          path: |
            licence-report/licences.json
            licence-report/console-bundle.txt

  manifest:
    needs: [caddy, images, licences]
    runs-on: ubuntu-24.04
    permissions:
      # uploads release-images.json and the licence report to the release
      # of this tag
      contents: write
      # reads the private images' signatures for the check below
      packages: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: licence-report
          path: licence-report
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      # every digest is verified once more with the identity deploy.yml uses,
      # so a manifest is only published for images a deploy will accept
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: write and verify release-images.json
        env:
          TAG: ${{ github.ref_name }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release-images.yml@${{ github.ref }}
        run: |
          python3 scripts/supply-chain/release-manifest.py digests "$TAG" > release-images.json
          python3 -c 'import json,sys; [print(i["repo"]+"@"+i["digest"]) for i in json.load(open("release-images.json"))["images"].values()]' |
          while read -r ref; do
            if [ "$SIGNING_MODE" = key ]; then
              cosign verify --key infra/ansible/vars/release-cosign.pub --insecure-ignore-tlog=true "$ref" >/dev/null
            else
              cosign verify --certificate-identity "$IDENTITY" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" >/dev/null
            fi
          done
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: env.SIGNING_MODE == 'keyless'
        with:
          subject-path: |
            release-images.json
            licence-report/licences.json
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes "images: release-images.json"
          gh release upload "$TAG" release-images.json licence-report/licences.json licence-report/console-bundle.txt --clobber

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # installed from the release tarball with its checksum so the linter version is pinned
      - name: install golangci-lint
        run: |
          v="${GOLANGCI_LINT_VERSION#v}"
          base="https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}"
          curl -fsSLO "${base}/golangci-lint-${v}-linux-amd64.tar.gz"
          curl -fsSLO "${base}/golangci-lint-${v}-checksums.txt"
          grep " golangci-lint-${v}-linux-amd64.tar.gz\$" "golangci-lint-${v}-checksums.txt" | sha256sum -c -
          tar -xzf "golangci-lint-${v}-linux-amd64.tar.gz"
          sudo install "golangci-lint-${v}-linux-amd64/golangci-lint" /usr/local/bin/
      - run: make vet
      - run: make lint
      # links in docs/ resolve and guide snippets equal their examples/ sources
      - run: make docs-check
      # db-ip country lite (cc by 4.0) for the gateway geo tests
      # the month's geo and network data, downloaded once per month and kept in
      # the actions cache: db-ip refuses some downloads from shared runner
      # addresses with 403, so every job fetching its own copy failed at random
      - id: geo-month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: geo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .scratch/geo
          key: geo-${{ steps.geo-month.outputs.month }}-${{ hashFiles('scripts/fetch-dbip.sh', 'scripts/fetch-network.sh', 'scripts/dbipcheck/**', 'scripts/netdata/**') }}
      - if: steps.geo-cache.outputs.cache-hit != 'true'
        run: make geo-fetch GEO_MONTH=${{ steps.geo-month.outputs.month }}
      - run: make test
        env:
          DBIP_MMDB: .scratch/geo/dbip-country-lite.mmdb

  # the default-build packages whose tests start postgresql, nats, umami or
  # caddy through testcontainers (scripts/go-test-packages.sh)
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # the engine production runs; the caddy tests check docker's port
      # forwarding, which differs on the runner image's older engine
      - run: scripts/ci/install-docker.sh
      # the gateway geo tests read the db-ip country file
      # the month's geo and network data, downloaded once per month and kept in
      # the actions cache: db-ip refuses some downloads from shared runner
      # addresses with 403, so every job fetching its own copy failed at random
      - id: geo-month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: geo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .scratch/geo
          key: geo-${{ steps.geo-month.outputs.month }}-${{ hashFiles('scripts/fetch-dbip.sh', 'scripts/fetch-network.sh', 'scripts/dbipcheck/**', 'scripts/netdata/**') }}
      - if: steps.geo-cache.outputs.cache-hit != 'true'
        run: make geo-fetch GEO_MONTH=${{ steps.geo-month.outputs.month }}
      - run: make test-containers
        env:
          DBIP_MMDB: .scratch/geo/dbip-country-lite.mmdb

  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the browser matrix in tests/e2e runs real chromium, firefox and webkit
      - run: pnpm --filter ./tests/e2e exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check
      - run: pnpm test
      # the browser matrix against the fixture gateway, with the runner's
      # browsers (make e2e-matrix runs them in a container instead)
      - run: pnpm --filter ./tests/e2e run matrix

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make dev-up
      - run: make umami-bootstrap
      # a second run must be a no-op, the bootstrap is idempotent
      - run: make umami-bootstrap
      - run: make test-integration
      - if: failure()
        run: docker compose --env-file deploy/compose/.env.dev -f deploy/compose/dev.yml logs --tail 200

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make image CMD=platformctl

  # secrets in the whole history, not only the change
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: scripts/supply-chain/install-tools.sh "$RUNNER_TEMP/bin" gitleaks
      - run: make gitleaks GITLEAKS="$RUNNER_TEMP/bin/gitleaks"

  # shipped code and its production dependencies must carry an osi approved
  # licence; dev, test, example and tooling packages with another licence
  # must be on the reviewed allowlist (docs/security/licence-policy.json)
  licences:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      # trivy reads licences from the module cache and node_modules
      - run: pnpm install --frozen-lockfile
      - run: scripts/supply-chain/install-tools.sh "$RUNNER_TEMP/bin" trivy
      # the java example's maven tree, resolved once per pom and kept in the
      # actions cache: maven central answers shared runner addresses with
      # 429 or a false 404 at times, so every run resolving it afresh failed
      # at random
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('examples/otel-java-spring/pom.xml', 'examples/otel-java-spring/Dockerfile') }}
      - run: PATH="$RUNNER_TEMP/bin:$PATH" scripts/supply-chain/licence-gate.sh licence-report
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licence-report
          path: licence-report/

  # the tenant isolation gate: required on every pull request
  # and for every release
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make isolation

  # the deploy-time signature checks against a real registry, with a
  # test-only ephemeral key (tests/supplychain)
  supplychain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # uv builds the ansible venv; the runner image does not pin it. the
      # tools go on the path of the later steps
      - run: |
          scripts/supply-chain/install-tools.sh "$RUNNER_TEMP/bin" cosign uv
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make ansible-venv
      - run: make supplychain-it

  # the workflows themselves, with shellcheck on every run: block
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          scripts/supply-chain/install-tools.sh "$RUNNER_TEMP/bin" actionlint shellcheck
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make actionlint

  # opentofu formatting, provider schema validation and the inventory
  # contract tests against mocked providers (tests/infra); needs no account
  tofu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      - run: make tofu-check

  # yamllint and ansible-lint (production profile) over roles and playbooks
  ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          scripts/supply-chain/install-tools.sh "$RUNNER_TEMP/bin" uv
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make ansible-venv
      - run: make ansible-lint
      # the nats liveness settings of the rendered role files (tests/natsconf)
      - run: make ansible-render-test

  # alert and recording rules: syntax, then the promtool unit tests, with
  # the promtool of the prometheus pin
  promtool:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          scripts/supply-chain/install-tools.sh "$RUNNER_TEMP/bin" promtool
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make promtool

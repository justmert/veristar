name: stellartoml-live

# fetches and parses a real ecosystem domain's stellar.toml through the
# production request-forgery guard. it depends on a third
# party site, so it runs on a schedule and by hand, never on push or pull
# request, and never gates ci.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -tags live -count=1 -run TestLiveStellarToml -v ./internal/controlplane/domaincheck/

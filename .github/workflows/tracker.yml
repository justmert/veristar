name: tracker

on:
  push:
    branches: [main]
  pull_request:
  # filter lists change without notice, so the list check also runs daily
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  releases:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the immutability check reads the release files at the base commit
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: immutability, reproducibility and size
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        # a push that creates the branch has no "before" commit; compare with the parent then
        run: |
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=HEAD~1; fi
          pnpm --filter tracker verify-releases --base "$BASE"

  filter-lists:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter adblock-test test

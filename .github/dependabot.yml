# dependency update pull requests. every pull request runs the
# ci gates, including the isolation suite, before review. security updates
# are not grouped, so each one can be merged on its own inside the 24 hour
# window; routine version updates are grouped per ecosystem to keep the
# queue reviewable. versions still follow the pin policy (a minor line
# younger than 30 days is skipped unless it carries a security fix), so a
# reviewer may close an update that is too young.
#
# umami is deliberately not updated here: its digest moves only through
# `make umami-upgrade VERSION=` (docs/runbooks/security-patch.md), which runs
# the compatibility, isolation and end-to-end gates.
version: 2

updates:
  - package-ecosystem: gomod
    directories: ["/", "/examples/otel-go-nethttp"]
    schedule: { interval: weekly, day: monday }
    groups:
      go:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: npm
    # the pnpm workspace (apps, packages, examples, tests) has one lockfile.
    # its security updates end without a pull request: the updater runs node
    # 24 against engines node 26 with engineStrict, and it never writes pnpm
    # overrides for a transitive package. no option here changes either, so
    # the alerts are patched by hand (docs/runbooks/security-patch.md,
    # section 4, npm packages)
    directories: ["/", "/examples/otel-node-express"]
    schedule: { interval: weekly, day: monday }
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/deploy/images", "/infra/local", "/examples/otel-go-nethttp", "/examples/otel-node-express", "/examples/otel-python-fastapi", "/examples/otel-rust-actix"]
    schedule: { interval: weekly, day: monday }

  # the upstream images production runs are pinned in ansible variables
  # (infra/ansible/vars/pins.yml upstream_images, roles/observability
  # observability_images), which dependabot cannot parse. each has a one-line
  # dockerfile here that it can; a pull request that moves one fails
  # tests/pins until the ansible pin is moved to the same reference, so the
  # reviewer completes the change in the same pull request.
  - package-ecosystem: docker
    directories: ["/deploy/images/upstream"]
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: docker-compose
    directories: ["/deploy/compose", "/tests/observability"]
    schedule: { interval: weekly, day: monday }
    ignore:
      # moved only by make umami-upgrade, see above
      - dependency-name: ghcr.io/umami-software/umami

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/release-image"]
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: terraform
    # opentofu reads the same provider blocks; dependabot resolves them
    # from the registry named in required_providers
    directories: ["/infra/tofu/envs/staging", "/infra/tofu/envs/production", "/infra/tofu/modules/*"]
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: uv
    directories: ["/examples/otel-python-fastapi"]
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: pip
    directories: ["/infra/ansible"]
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: cargo
    directories: ["/examples/otel-rust-actix"]
    schedule: { interval: weekly, day: monday }

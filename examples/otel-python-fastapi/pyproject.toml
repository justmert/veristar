[project]
name = "otel-python-fastapi"
version = "1.0.0"
description = "fastapi example that dual-exports opentelemetry data to a tenant backend and veristar"
requires-python = "==3.14.10"
# docs:start dependencies
dependencies = [
    "fastapi==0.161.1",
    "uvicorn==0.54.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
]
# docs:end dependencies

[tool.uv]
package = false

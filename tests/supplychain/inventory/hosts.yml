---
# test-only inventory of tests/supplychain: the controller alone. the
# verification tasks refuse the ephemeral key mode for any inventory that
# does not live under tests/.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  # verify_test.go also passes sa_signature_mode=test-ephemeral-key as an
  # extra var, because verify.yml's vars/signing.yml outranks this value
  vars:
    sa_signature_mode: test-ephemeral-key

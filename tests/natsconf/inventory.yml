---
# test-only inventory of tests/natsconf. two layouts in one inventory, told
# apart by group: "node" is the converged three-node layout of production
# (sa_tier node, every host in edge and core), "split" is the single-tier
# layout with three edge and two core hosts. render.yml runs each layout with
# its own groups mapped to edge and core.
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    sa_environment: test
  children:
    node:
      hosts:
        node-1: {sa_tier: node, sa_private_ip: 10.10.1.11}
        node-2: {sa_tier: node, sa_private_ip: 10.10.2.12}
        node-3: {sa_tier: node, sa_private_ip: 10.10.3.13}
    split_edge:
      hosts:
        edge-1: {sa_tier: edge, sa_private_ip: 10.20.1.1}
        edge-2: {sa_tier: edge, sa_private_ip: 10.20.1.2}
        edge-3: {sa_tier: edge, sa_private_ip: 10.20.1.3}
    split_core:
      hosts:
        core-1: {sa_tier: core, sa_private_ip: 10.20.2.1}
        core-2: {sa_tier: core, sa_private_ip: 10.20.2.2}
